<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পিড রেসার - aionline.in.net</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --road-bg: #1e293b;
            --accent-green: #10b981;
            --gold: #facc15;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            margin-bottom: 8px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            color: var(--accent-green);
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            letter-spacing: 1px;
        }

        .header a {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 520px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(16, 185, 129, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* স্কোর ও স্পিডোমিটার বার */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px #000;
        }

        .hud-badge {
            background: rgba(15, 23, 42, 0.8);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        /* মোডাল */
        #game-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 18, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 50;
        }

        #game-modal h2 {
            font-size: 28px;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        #game-modal p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 12px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        /* মোবাইল স্পর্শ কন্ট্রোল বাটন */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-top: 12px;
            padding: 0 10px;
            gap: 15px;
        }

        .ctrl-btn {
            flex: 1;
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 0;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .ctrl-btn:active {
            background: var(--accent-green);
            color: #0b0f19;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏎️ স্পিড রেসার (Speed Racer)</h1>
        <a href="https://aionline.in.net" target="_blank">aionline.in.net</a>
    </div>

    <div id="game-container">
        <canvas id="raceCanvas" width="360" height="520"></canvas>
        
        <div id="hud">
            <div class="hud-badge">স্কোর: <span id="score" style="color:var(--gold);">0</span></div>
            <div class="hud-badge">গতি: <span id="speed-meter" style="color:var(--accent-green);">80 km/h</span></div>
        </div>

        <div id="game-modal">
            <h2 id="modal-title">হাইওয়ে চ্যালেঞ্জ!</h2>
            <p id="modal-desc">
                ট্রাফিকের অন্যান্য গাড়িগুলো এড়িয়ে চলুন!<br>
                কয়েন সংগ্রহ করে অতিরিক্ত বোনাস স্কোর জিতুন।<br><br>
                <small style="color:#94a3b8;">PC: <b>A / D</b> বা <b>Arrow Keys</b> দিয়ে ডানে-বামে সরুন</small>
            </p>
            <button class="btn-start" id="start-btn">রেস শুরু করুন</button>
        </div>
    </div>

    <div class="mobile-controls">
        <button class="ctrl-btn" id="left-btn">◀ বামে</button>
        <button class="ctrl-btn" id="right-btn">ডানে ▶</button>
    </div>

    <script>
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');

        const scoreElem = document.getElementById('score');
        const speedMeter = document.getElementById('speed-meter');
        const modal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const startBtn = document.getElementById('start-btn');

        let isRunning = false;
        let score = 0;
        let baseSpeed = 5;
        let speed = baseSpeed;
        let roadOffset = 0;

        const LANES = [80, 140, 200, 260]; // ৪টি লেনের সেন্টার কোঅর্ডিনেট
        let currentLane = 1; // প্লেয়ারের প্রাথমিক লেন (১ মানে দ্বিতীয় লেন)

        const player = {
            x: LANES[currentLane],
            targetX: LANES[currentLane],
            y: 410,
            width: 38,
            height: 68,
            color: '#10b981'
        };

        let traffic = [];
        let coins = [];
        let particles = [];

        const CAR_COLORS = ['#ef4444', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];

        function spawnTraffic() {
            if (!isRunning) return;
            const laneIndex = Math.floor(Math.random() * LANES.length);
            
            // কাছাকাছি ওভারল্যাপ এড়ানো
            for (let c of traffic) {
                if (c.lane === laneIndex && c.y < 120) return;
            }

            traffic.push({
                lane: laneIndex,
                x: LANES[laneIndex],
                y: -80,
                width: 38,
                height: 68,
                speedMultiplier: Math.random() * 0.4 + 0.5,
                color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]
            });
        }

        function spawnCoin() {
            if (!isRunning) return;
            const laneIndex = Math.floor(Math.random() * LANES.length);
            coins.push({
                x: LANES[laneIndex],
                y: -30,
                radius: 12
            });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: ['#ef4444', '#f59e0b', '#ffffff', '#334155'][Math.floor(Math.random() * 4)],
                    life: 30,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function movePlayer(direction) {
            if (!isRunning) return;
            if (direction === 'left' && currentLane > 0) {
                currentLane--;
            } else if (direction === 'right' && currentLane < LANES.length - 1) {
                currentLane++;
            }
            player.targetX = LANES[currentLane];
        }

        // ইনপুট হ্যান্ডলিং
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'arrowleft' || k === 'a') movePlayer('left');
            if (k === 'arrowright' || k === 'd') movePlayer('right');
        });

        document.getElementById('left-btn').addEventListener('click', () => movePlayer('left'));
        document.getElementById('right-btn').addEventListener('click', () => movePlayer('right'));

        function resetGame() {
            score = 0;
            currentLane = 1;
            player.x = LANES[currentLane];
            player.targetX = LANES[currentLane];
            traffic = [];
            coins = [];
            particles = [];
            speed = baseSpeed;
            isRunning = true;
            modal.style.display = 'none';
            scoreElem.innerText = score;
        }

        function gameOver() {
            isRunning = false;
            createExplosion(player.x, player.y);
            modalTitle.innerText = "ভয়াবহ ক্র্যাশ!";
            modalDesc.innerText = `আপনি হাইওয়েতে ধাক্কা খেয়েছেন!\nমোট স্কোর: ${score} পয়েন্ট।`;
            startBtn.innerText = "আবার খেলুন";
            modal.style.display = 'flex';
        }

        startBtn.addEventListener('click', resetGame);

        let frameCount = 0;

        function update() {
            if (!isRunning) return;
            frameCount++;

            // গতি ক্রমশ বৃদ্ধি পাওয়া
            speed = baseSpeed + Math.min(8, Math.floor(score / 150));
            speedMeter.innerText = `${Math.round(speed * 16)} km/h`;

            // স্কোর বৃদ্ধি
            if (frameCount % 6 === 0) {
                score++;
                scoreElem.innerText = score;
            }

            // প্লেয়ার লেন ট্রানজিশন স্মুথিং
            player.x += (player.targetX - player.x) * 0.25;

            // হাইওয়ে রোলিং
            roadOffset = (roadOffset + speed) % 40;

            // স্পন টাইমার
            if (frameCount % Math.max(35, 75 - Math.floor(speed * 2.5)) === 0) {
                spawnTraffic();
            }
            if (frameCount % 120 === 0) {
                spawnCoin();
            }

            // ট্রাফিক আপডেট
            for (let i = traffic.length - 1; i >= 0; i--) {
                const c = traffic[i];
                c.y += speed * c.speedMultiplier;

                // কলিশন ডিটেকশন (প্লেয়ারের সাথে ক্র্যাশ)
                if (
                    Math.abs(player.x - c.x) < (player.width + c.width) * 0.42 &&
                    Math.abs(player.y - c.y) < (player.height + c.height) * 0.42
                ) {
                    gameOver();
                    return;
                }

                if (c.y > canvas.height + 100) traffic.splice(i, 1);
            }

            // কয়েন আপডেট
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.y += speed;

                // কয়েন পিকআপ
                if (Math.hypot(player.x - coin.x, player.y - coin.y) < player.width * 0.7 + coin.radius) {
                    score += 50;
                    scoreElem.innerText = score;
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.y > canvas.height + 50) coins.splice(i, 1);
            }

            // পার্টিকেল আপডেট
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // আকর্ষণীয় স্পোর্টস কার ড্র ফাংশন
        function drawCar(x, y, color, isPlayer = false) {
            ctx.save();
            ctx.translate(x, y);

            // কার বডি
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-16, -30, 32, 60, 6);
            ctx.fill();

            // ছাদ ও কাঁচ
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(-12, -14, 24, 28, 4);
            ctx.fill();

            // ফ্রন্ট গ্লাস
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.roundRect(-10, -18, 20, 7, 2);
            ctx.fill();

            // হেডলাইট
            ctx.fillStyle = isPlayer ? '#38bdf8' : '#fef08a';
            ctx.fillRect(-13, -32, 6, 3);
            ctx.fillRect(7, -32, 6, 3);

            // টেইল লাইট
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-13, 29, 6, 3);
            ctx.fillRect(7, 29, 6, 3);

            // চাকা (Tires)
            ctx.fillStyle = '#000000';
            ctx.fillRect(-19, -24, 4, 12);
            ctx.fillRect(15, -24, 4, 12);
            ctx.fillRect(-19, 12, 4, 12);
            ctx.fillRect(15, 12, 4, 12);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // হাইওয়ে ব্যাকগ্রাউন্ড
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(40, 0, 280, canvas.height);

            // ফুটপাত/রোড সাইড
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, 40, canvas.height);
            ctx.fillRect(320, 0, 40, canvas.height);

            // রোড মার্জিন হলুদ লাইন
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(43, 0); ctx.lineTo(43, canvas.height);
            ctx.moveTo(317, 0); ctx.lineTo(317, canvas.height);
            ctx.stroke();

            // লেনের ড্যাশড সাদা লাইন
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            [110, 170, 230].forEach(laneX => {
                ctx.beginPath();
                ctx.moveTo(laneX, 0);
                ctx.lineTo(laneX, canvas.height);
                ctx.stroke();
            });

            ctx.setLineDash([]); // লাইন ড্যাশ রিসেট

            // কয়েন ড্র
            coins.forEach(c => {
                ctx.save();
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ca8a04';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', c.x, c.y);
                ctx.restore();
            });

            // ট্রাফিক গাড়ি ড্র
            traffic.forEach(c => {
                drawCar(c.x, c.y, c.color);
            });

            // পার্টিকেল ড্র
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // প্লেয়ারের গাড়ি ড্র
            if (isRunning) {
                drawCar(player.x, player.y, player.color, true);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
