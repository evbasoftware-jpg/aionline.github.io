<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>🌐 গুগল ১৩৩+ ভাষা অনুবাদ ও ভয়েস ট্রান্সলেটর</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
    }

    .header {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1.5px solid #e2e8f0;
    }

    .header h2 {
      margin: 0;
      font-size: 19px;
      color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ভাষা নির্বাচন বার */
    .lang-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f8fafc;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }

    .lang-select-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .lang-select-box label {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
    }

    .lang-picker-btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 8px;
      border: 1.5px solid #0284c7;
      background: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      text-align: left;
    }

    .lang-picker-btn span.lbl-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .swap-btn {
      width: 40px;
      height: 40px;
      margin-top: 16px;
      border-radius: 50%;
      border: 1.5px solid #0284c7;
      background: #e0f2fe;
      color: #0284c7;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .swap-btn:active {
      transform: scale(0.92);
    }

    /* ভয়েস (Male / Female) নির্বাচন বার */
    .voice-gender-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      gap: 10px;
    }

    .voice-gender-label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .gender-toggle-group {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 8px;
      gap: 4px;
    }

    .gender-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: #475569;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .gender-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 5px rgba(2, 132, 199, 0.25);
    }

    /* লেখার জায়গা ও আউটপুট বক্স */
    .text-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .text-card:focus-within {
      border-color: #0284c7;
    }

    .output-card {
      background: #f0f9ff;
      border-color: #7dd3fc;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
    }

    .clear-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 16px;
      line-height: 1.5;
      background: transparent;
      color: #0f172a;
    }

    .output-text {
      min-height: 110px;
      font-size: 16.5px;
      line-height: 1.55;
      color: #0369a1;
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .placeholder-text {
      color: #94a3b8;
      font-weight: 400;
    }

    /* অ্যাকশন বাটনসমূহ (ভয়েস, কপি, শেয়ার) */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }

    .action-btn {
      flex: 1;
      min-width: 95px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .btn-voice {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #047857;
    }

    .btn-voice.speaking {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    .btn-copy {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .btn-share {
      background: #fefce8;
      border-color: #fde047;
      color: #a16207;
    }

    .translate-main-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: transform 0.15s;
    }

    .translate-main-btn:active {
      transform: scale(0.98);
    }

    /* ভাষা নির্বাচনের সার্চ মডাল */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-overlay.hidden {
      display: none !important;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .modal-header h4 {
      margin: 0;
      color: #0284c7;
      font-size: 16px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
    }

    .lang-search-box {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    .lang-search-box:focus {
      border-color: #0284c7;
    }

    .lang-list-scroll {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lang-item-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .lang-item-btn.active {
      background: #f0f9ff;
      border-color: #0284c7;
      color: #0284c7;
      font-weight: 700;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.75; }
      100% { opacity: 1; }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 99999;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h2>🌐 অনুবাদ ও ভয়েস ট্রান্সলেটর (১৩৩+ ভাষা)</h2>
  </div>

  <!-- ভাষা নির্বাচন বার -->
  <div class="lang-controls">
    <div class="lang-select-box">
      <label>কোন ভাষা থেকে (Source):</label>
      <button type="button" class="lang-picker-btn" onclick="openLangModal('source')">
        <span class="lbl-text" id="sourceLangLabel">✨ স্বয়ংক্রিয় শনাক্ত (Auto)</span>
        <span style="color:#0284c7;font-size:11px;">▼</span>
      </button>
    </div>

    <button type="button" class="swap-btn" onclick="swapLanguages()" title="ভাষা অদলবদল করুন">⇄</button>

    <div class="lang-select-box">
      <label>কোন ভাষায় অনুবাদ হবে (Target):</label>
      <button type="button" class="lang-picker-btn" onclick="openLangModal('target')">
        <span class="lbl-text" id="targetLangLabel">English (English)</span>
        <span style="color:#0284c7;font-size:11px;">▼</span>
      </button>
    </div>
  </div>

  <!-- ভয়েস (Male / Female) নির্বাচন অপশন -->
  <div class="voice-gender-bar">
    <span class="voice-gender-label">🎙️ ভয়েস কণ্ঠ নির্বাচন:</span>
    <div class="gender-toggle-group">
      <button type="button" id="btnGenderFemale" class="gender-btn active" onclick="setVoiceGender('female')">
        👩 Female
      </button>
      <button type="button" id="btnGenderMale" class="gender-btn" onclick="setVoiceGender('male')">
        👨 Male
      </button>
    </div>
  </div>

  <!-- মূল লেখার জায়গা (Input) -->
  <div class="text-card">
    <div class="card-top">
      <span>✍️ আপনার লেখা লিখুন বা পেস্ট করুন:</span>
      <button type="button" class="clear-btn" onclick="clearAllText()">✕ মুছুন</button>
    </div>
    <textarea id="inputText" placeholder="এখানে যেকোনো ভাষায় কিছু লিখুন..." oninput="scheduleAutoTranslate()"></textarea>
    
    <div class="action-bar">
      <button type="button" class="action-btn btn-voice" id="btnSpeakInput" onclick="speakText('input')">
        🔊 ভয়েসে শুনুন
      </button>
      <button type="button" class="action-btn btn-copy" onclick="copyText('input')">
        📋 কপি
      </button>
      <button type="button" class="action-btn btn-share" onclick="shareText('input')">
        📤 শেয়ার
      </button>
    </div>
  </div>

  <!-- অনুবাদ বাটন -->
  <button type="button" class="translate-main-btn" id="translateBtn" onclick="performTranslation()">
    🔄 অনুবাদ করুন (Translate)
  </button>

  <!-- অনুবাদকৃত ফলাফল (Output) -->
  <div class="text-card output-card">
    <div class="card-top">
      <span>✅ অনুবাদকৃত লেখা:</span>
      <span id="statusIndicator" style="font-size: 11.5px; color: #0284c7;"></span>
    </div>
    <div id="outputText" class="output-text placeholder-text">অনুবাদ এখানে দেখা যাবে...</div>

    <div class="action-bar">
      <button type="button" class="action-btn btn-voice" id="btnSpeakOutput" onclick="speakText('output')">
        🔊 ভয়েসে শুনুন
      </button>
      <button type="button" class="action-btn btn-copy" onclick="copyText('output')">
        📋 কপি
      </button>
      <button type="button" class="action-btn btn-share" onclick="shareText('output')">
        📤 শেয়ার
      </button>
    </div>
  </div>
</div>

<!-- ভাষা নির্বাচনের সার্চ মডাল -->
<div id="languageModal" class="modal-overlay hidden" onclick="if(event.target===this) closeLangModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h4 id="modalTitle">🌐 ভাষা নির্বাচন করুন (১৩৩+ ভাষা)</h4>
      <button type="button" class="modal-close" onclick="closeLangModal()">&times;</button>
    </div>
    <input type="text" id="langSearchInput" class="lang-search-box" placeholder="🔍 ভাষা খুঁজুন (যেমন: Bengali, Hindi, Arabic, French)..." oninput="renderLanguageOptions(this.value)">
    <div id="languageOptionsList" class="lang-list-scroll"></div>
  </div>
</div>

<!-- ভয়েস অডিও প্লেয়ার -->
<audio id="ttsAudioPlayer" referrerpolicy="no-referrer" playsinline style="display:none;"></audio>

<!-- টোস্ট বার্তা -->
<div id="toastMsg" class="toast"></div>

  function renderLanguageOptions(query) {
    const container = document.getElementById("languageOptionsList");
    const q = (query || "").trim().toLowerCase();
    const activeCode = currentModalMode === "source" ? selectedSourceLang : selectedTargetLang;

    let html = "";

    if (currentModalMode === "source" && (!q || "auto detect স্বয়ংক্রিয়".includes(q))) {
      const isAuto = activeCode === "auto";
      html += `
        <button type="button" class="lang-item-btn ${isAuto ? 'active' : ''}" onclick="pickLanguage('auto')">
          <span>✨ <b>স্বয়ংক্রিয় শনাক্ত</b> <span style="font-size:12px;color:#64748b;">(Auto Detect)</span></span>
          ${isAuto ? '<span style="color:#0284c7;font-weight:bold;">✓</span>' : ''}
        </button>
      `;
    }

    const filtered = GOOGLE_LANGUAGES.filter(item => {
      if (!q) return true;
      return item.name.toLowerCase().includes(q) ||
             item.eng.toLowerCase().includes(q) ||
             item.code.toLowerCase().includes(q);
    });

    if (filtered.length === 0 && !html) {
      container.innerHTML = `<div style="padding:16px;text-align:center;color:#64748b;">কোনো ভাষা পাওয়া যায়নি</div>`;
      return;
    }

    filtered.forEach(item => {
      const isSelected = item.code === activeCode;
      html += `
        <button type="button" class="lang-item-btn ${isSelected ? 'active' : ''}" onclick="pickLanguage('${item.code}')">
          <span><b>${item.name}</b> <span style="font-size:12px;color:#64748b;">(${item.eng})</span></span>
          ${isSelected ? '<span style="color:#0284c7;font-weight:bold;">✓</span>' : ''}
        </button>
      `;
    });

    container.innerHTML = html;
  }

    if (document.getElementById("inputText").value.trim()) {

  function swapLanguages() {

    if (selectedSourceLang === "auto") {
      selectedSourceLang = selectedTargetLang;
      selectedTargetLang = detectedSourceLang || "bn";
    } else {
      const temp = selectedSourceLang;
      selectedSourceLang = selectedTargetLang;
      selectedTargetLang = temp;
    }

    updateLanguageLabels();

    if (translatedResult.trim()) {
      inputEl.value = translatedResult;
      performTranslation();
    }

  async function performTranslation() {
    const rawText = document.getElementById("inputText").value.trim();
    if (!rawText) {
      resetOutput();
      return;
    }

    const sl = selectedSourceLang;
    const tl = selectedTargetLang;
    const statusEl = document.getElementById("statusIndicator");
    const outEl = document.getElementById("outputText");

    statusEl.textContent = "⏳ অনুবাদ হচ্ছে...";

    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(rawText)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Network error");

      const data = await response.json();
      if (data && Array.isArray(data[0])) {
        translatedResult = data[0].map(item => item[0] || "").join("");
        if (data[2]) detectedSourceLang = data[2];

        outEl.textContent = translatedResult;
        outEl.classList.remove("placeholder-text");
        statusEl.textContent = "✓ সম্পন্ন";
      }
    } catch (err) {
      try {
        const srcCode = sl === "auto" ? "bn" : sl;
        const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(rawText.slice(0, 480))}&langpair=${encodeURIComponent(srcCode + "|" + tl)}`;
        const mmRes = await fetch(mmUrl);
        const mmData = await mmRes.json();
        if (mmData && mmData.responseData && mmData.responseData.translatedText) {
          translatedResult = mmData.responseData.translatedText;
          outEl.textContent = translatedResult;
          outEl.classList.remove("placeholder-text");
          statusEl.textContent = "✓ সম্পন্ন";
          return;
        }
      } catch (_) {}

      statusEl.textContent = "❌ অনুবাদ ব্যর্থ হয়েছে";
      showToast("ইন্টারনেট সংযোগ পরীক্ষা করুন");
    }
  }

    }
  }

  function splitTextChunks(text, maxLen = 170) {
    const clean = (text || "").trim();
    if (!clean) return [];
    if (clean.length <= maxLen) return [clean];
    const parts = clean.split(/(?<=[।.!?])\s+/);
    const chunks = [];
    let cur = "";
    for (const p of parts) {
      if ((cur + " " + p).trim().length <= maxLen) {
        cur = (cur + " " + p).trim();
      } else {
        if (cur) chunks.push(cur);
        cur = p.slice(0, maxLen);
      }
    }
    if (cur) chunks.push(cur);
    return chunks.length ? chunks : [clean.slice(0, maxLen)];
  }

  // ১) ফিমেল ভয়েস: অনলাইন Google Female TTS + ব্রাউজার ফিমেল ব্যাকআপ
  function playFemaleVoice(text, lang, token) {
    const audio = document.getElementById("ttsAudioPlayer");
    const chunks = splitTextChunks(text, 170);
    const tl = lang === "en" ? "en-IN" : lang;
    let chunkIdx = 0;

    function playNextChunk(mirrorIdx) {
      if (token !== speechSessionToken) return;
      if (chunkIdx >= chunks.length) {
        stopSpeaking();
        return;
      }

      const q = encodeURIComponent(chunks[chunkIdx]);
      const l = encodeURIComponent(tl);
      const mirrors = [
        `https://translate.google.com/translate_tts?ie=UTF-8&q=${q}&tl=${l}&client=tw-ob`,
        `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${q}&tl=${l}&client=gtx`
      ];

      if (mirrorIdx >= mirrors.length) {
        playViaSpeechSynthesis(chunks.slice(chunkIdx).join(" "), lang, "female", token);
        return;
      }

      audio.onended = () => {
        if (token !== speechSessionToken) return;
        chunkIdx++;
        playNextChunk(0);
      };

      audio.onerror = () => {
        if (token !== speechSessionToken) return;
        playNextChunk(mirrorIdx + 1);
      };

      audio.src = mirrors[mirrorIdx];
      const p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => {
          if (token !== speechSessionToken) return;
          playViaSpeechSynthesis(chunks.slice(chunkIdx).join(" "), lang, "female", token);
        });
      }
    }

    playNextChunk(0);
  }

  // ২) মেল ভয়েস: বাস্তব পুরুষ কণ্ঠস্বর (Online Male TTS Audio প্রথমে, ব্যর্থ হলে ডিভাইস Male Voice)
  function playMaleVoice(text, lang, token) {
    const base = (lang || "en").split("-")[0].toLowerCase();
    const onlineVoiceName = TRUE_ONLINE_MALE_VOICE[base];

    // যদি অনলাইন বাস্তব পুরুষ ভয়েস (যেমন English: Brian, Hindi/Spanish/French/German ইত্যাদি) থাকে:
    if (onlineVoiceName) {
      const audio = document.getElementById("ttsAudioPlayer");
      const chunks = splitTextChunks(text, 220);
      let chunkIdx = 0;

      function playMaleChunk() {
        if (token !== speechSessionToken) return;
        if (chunkIdx >= chunks.length) {
          stopSpeaking();
          return;
        }

        const q = encodeURIComponent(chunks[chunkIdx]);
        const url = `https://api.streamelements.com/kappa/v2/speech?voice=${encodeURIComponent(onlineVoiceName)}&text=${q}`;

        audio.onended = () => {
          if (token !== speechSessionToken) return;
          chunkIdx++;
          playMaleChunk();
        };

        audio.onerror = () => {
          if (token !== speechSessionToken) return;
          playViaSpeechSynthesis(chunks.slice(chunkIdx).join(" "), lang, "male", token);
        };

        audio.src = url;
        const p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => {
            if (token !== speechSessionToken) return;
            playViaSpeechSynthesis(chunks.slice(chunkIdx).join(" "), lang, "male", token);
          });
        }
      }

      playMaleChunk();
      return;
    }

    // বাংলা বা যেসব ভাষার অনলাইন Polly Male ভয়েস নেই, সেগুলোর জন্য সিস্টেমের Male ভয়েস
    playViaSpeechSynthesis(text, lang, "male", token);
  }

  // ব্রাউজার ভয়েস নির্বাচন (ব্যাকআপ)
  function selectBestGenderVoice(langCode, gender) {
    loadSystemVoices();
    const voices = cachedVoices.length ? cachedVoices : (window.speechSynthesis.getVoices() || []);
    if (!voices.length) return { voice: null, isTrueMale: false, isTrueFemale: false };

    const norm = (langCode || "en").replace("_", "-").toLowerCase();
    const base = norm.split("-")[0];

    const malePatterns = [
      "male", "man", "boy", "guy", "ravi", "david", "mark", "daniel", "alex",
      "hemant", "prabhat", "madhur", "rishi", "tanvir", "pradeep", "bashkar",
      "christopher", "eric", "steffan", "ryan", "thomas", "george", "oliver",
      "wavenet-b", "wavenet-d", "neural2-b", "neural2-d",
      "x-bnm", "x-bna", "x-bnb", "x-bdb", "x-hid", "x-hie", "x-gbb", "x-gbd",
      "x-tpd", "x-tpf", "x-iom", "x-iol", "x-end", "x-ene"
    ];

    const femalePatterns = [
      "female", "woman", "girl", "tanishaa", "nabanita", "swara", "aditi",
      "kavya", "lekha", "priya", "kalpana", "heera", "neerja", "zira",
      "samantha", "victoria", "karen", "aria", "sonia", "libby", "jenny",
      "wavenet-a", "wavenet-c", "wavenet-e", "x-bnf", "x-ban", "x-hia", "x-hic", "x-gba", "x-tpc", "x-sfg"
    ];

    const langVoices = voices.filter(v => {
      const vl = (v.lang || "").replace("_", "-").toLowerCase();
      return vl === base || vl.startsWith(base + "-");
    });

    if (!langVoices.length) return { voice: null, isTrueMale: false, isTrueFemale: false };

    let bestVoice = null;
    let bestScore = -9999;
    let bestIsTrueMale = false;
    let bestIsTrueFemale = false;

    for (const v of langVoices) {
      const sig = ((v.name || "") + " " + (v.voiceURI || "") + " " + (v.lang || "")).toLowerCase();
      const hasMale = malePatterns.some(p => sig.includes(p)) && !sig.includes("female");
      const hasFemale = !hasMale && femalePatterns.some(p => sig.includes(p));

      let score = 0;
      if (gender === "male") {
        if (hasMale) score += 1000;
        if (hasFemale) score -= 1000;
      } else {
        if (hasFemale) score += 1000;
        if (hasMale) score -= 1000;
      }

      if (score > bestScore) {
        bestScore = score;
        bestVoice = v;
        bestIsTrueMale = hasMale;
        bestIsTrueFemale = hasFemale;
      }
    }

    return {
      voice: bestVoice,
      isTrueMale: bestIsTrueMale,
      isTrueFemale: bestIsTrueFemale
    };
  }

  function playViaSpeechSynthesis(text, lang, gender, token) {
    if (!("speechSynthesis" in window)) {
      stopSpeaking();
      showToast("এই ব্রাউজারে ভয়েস সমর্থিত নয়");
      return;
    }

    try { window.speechSynthesis.cancel(); } catch (_) {}

    const base = (lang || "bn").split("-")[0].toLowerCase();
    const { voice, isTrueMale, isTrueFemale } = selectBestGenderVoice(lang, gender);
    const defaultLocale = SPEECH_LOCALE_MAP[lang] || SPEECH_LOCALE_MAP[base] || (base === "en" ? "en-GB" : lang);

    const utter = new SpeechSynthesisUtterance(text);

    if (voice) {
      utter.voice = voice;
      utter.lang = voice.lang || defaultLocale;
    } else {
      utter.lang = defaultLocale;
    }

    if (gender === "male") {
      utter.pitch = isTrueMale ? 0.96 : 0.72;
      utter.rate = 0.95;
    } else {
      utter.pitch = isTrueFemale ? 1.04 : 1.22;
      utter.rate = 0.96;
    }

    utter.onend = () => {
      if (token === speechSessionToken) stopSpeaking();
    };
    utter.onerror = () => {
      if (token === speechSessionToken) stopSpeaking();
    };

    setTimeout(() => {
      if (token === speechSessionToken) {
        window.speechSynthesis.speak(utter);
      }
    }, 60);
  }

  function speakText(type) {
    const btnId = type === "input" ? "btnSpeakInput" : "btnSpeakOutput";
    const btnEl = document.getElementById(btnId);

    if (activeVoiceBtnId === btnId) {
      stopSpeaking();
      return;
    }
    stopSpeaking();

    const text = type === "input"
      ? document.getElementById("inputText").value.trim()
      : translatedResult.trim();

    if (!text) {
      showToast("শোনার মতো কোনো লেখা নেই!");
      return;
    }

    let lang = type === "input"
      ? (selectedSourceLang === "auto" ? detectedSourceLang : selectedSourceLang)
      : selectedTargetLang;

    if (/[\u0980-\u09FF]/.test(text) && type === "input" && selectedSourceLang === "auto") {
      lang = "bn";
    }

    const currentToken = ++speechSessionToken;
    activeVoiceBtnId = btnId;
    btnEl.classList.add("speaking");
    btnEl.innerHTML = "⏹️ বন্ধ করুন";

    if (selectedVoiceGender === "male") {
      playMaleVoice(text, lang, currentToken);
    } else {
      playFemaleVoice(text, lang, currentToken);
    }
  }

  function stopSpeaking() {
    speechSessionToken++;
    const audioPlayer = document.getElementById("ttsAudioPlayer");
    if (audioPlayer) {
      try {
        audioPlayer.pause();
        audioPlayer.onended = null;
        audioPlayer.onerror = null;
        audioPlayer.removeAttribute("src");
        audioPlayer.load();
      } catch (_) {}
    }
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (_) {}
    }
    if (activeVoiceBtnId) {
      const oldBtn = document.getElementById(activeVoiceBtnId);
      if (oldBtn) {
        oldBtn.classList.remove("speaking");
        oldBtn.innerHTML = "🔊 ভয়েসে শুনুন";
      }
      activeVoiceBtnId = null;
    }
  }

  function showToast(msg) {
    const toast = document.getElementById("toastMsg");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2400);
  }
</script>

</body>
</html>
