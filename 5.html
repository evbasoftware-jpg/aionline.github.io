<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্মার্ট লাইভ ট্রেন ট্র্যাকার</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>

/* Vande Bharat Train Box */
.train-shop{
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

/* Train image area */
.train-interior{
    position:relative;
    width:100%;
    height:150px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(to bottom,#eaf6ff,#ffffff);
}

/* Vande Bharat image */
.vande-bharat{
    width:92%;
    max-width:430px;
    height:auto;
    object-fit:contain;
    transition:transform 1.4s ease-in;
    user-select:none;
    pointer-events:none;
}

/* Railway track */
.train-track{
    position:absolute;
    left:0;
    right:0;
    bottom:48px;
    height:5px;
    background:#555;
    box-shadow:
        0 9px 0 #777,
        0 18px 0 #999;
}

/* Sleepers */
.train-track::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:-5px;
    height:25px;

    background:repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 18px,
        #444 18px,
        #444 25px,
        transparent 25px,
        transparent 45px
    );
}

/* Title */
.train-title{
    position:absolute;
    top:8px;
    left:0;
    right:0;
    text-align:center;
    font-size:15px;
    font-weight:800;
    color:#222;
    text-shadow:0 1px 2px #fff;
}

/* Subtitle */
.train-subtitle{
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#174b82;
}

/* Moving train */
.train-shop.train-moving .vande-bharat{
    transform:translateX(140vw);
}

/* Optional slight vibration */
.train-shop.train-moving .train-interior{
    animation:trainShake .15s infinite alternate;
}

@keyframes trainShake{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-2px);
    }
}
    </style>
</head>
<body>
    <div class="shop border-yellow train-shop" onclick="startVandeBharat(this)">

    <div class="shop-number">02</div>

    <div class="train-interior">

        <div class="train-title">
            LIVE TRAIN LOCATION
        </div>

        <div class="rail-line"></div>

        <div class="vande-train">
            <div class="train-light left-light"></div>
            <div class="train-light right-light"></div>

            <div class="train-body">
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Vande_Bharat_Express_train.jpg/1280px-Vande_Bharat_Express_train.jpg"
                    alt="Vande Bharat Express">
            </div>
        </div>

    </div>

    <div class="train-name">
        Indian trains
    </div>

</div>
    
    <script>
<script>

function startVandeBharat(box){

    /* Prevent multiple clicks */
    if(box.classList.contains("train-running")){
        return;
    }

    box.classList.add("train-running");

    /* Train comes from LEFT */
    box.classList.add("train-arriving");


    /* After arrival */
    setTimeout(function(){

        box.classList.remove("train-arriving");

        box.classList.add("train-stopped");

        /* Horn sound */
        playTrainHorn();


    }, 2500);


    /* After stopping */
    setTimeout(function(){

        box.classList.remove("train-stopped");

        box.classList.add("train-departing");


    }, 3800);


    /* Open live train page */
    setTimeout(function(){

        window.location.href =
            "https://aionline.in.net/1.html";

    }, 4700);

}


/* Train horn */
function playTrainHorn(){

    try{

        const audioCtx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const oscillator =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();


        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(
            440,
            audioCtx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            220,
            audioCtx.currentTime + 0.8
        );


        gain.gain.setValueAtTime(
            0.0001,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.35,
            audioCtx.currentTime + 0.08
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + 0.8
        );


        oscillator.connect(gain);

        gain.connect(audioCtx.destination);


        oscillator.start();

        oscillator.stop(
            audioCtx.currentTime + 0.8
        );

    }catch(e){

        console.log("Horn audio blocked:",e);

    }

}

</script></body></html>
