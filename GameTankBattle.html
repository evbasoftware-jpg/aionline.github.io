<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D মাল্টিপ্লেয়ার এরিনা - aionline.in.net</title>
    <style>
        :root {
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --dark-bg: #030712;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* লবি ও কানেকশন ওভারলে */
        #lobby-screen {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #374151;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.25);
        }

        .card h1 {
            font-size: 24px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(135deg, #0891b2, #06b6d4);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-pink {
            background: linear-gradient(135deg, #db2777, #ec4899);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }

        input:focus {
            border-color: var(--accent-cyan);
        }

        /* ইন-গেম HUD */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .hud-box {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #374151;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
        }

        .bar {
            width: 100px;
            height: 8px;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .bar-inner {
            height: 100%;
            width: 100%;
            background: #22c55e;
            transition: width 0.2s;
        }

        /* অন-স্ক্রিন মোবাইল কন্ট্রোল */
        #mobile-controls {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 15;
            pointer-events: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 46px);
            grid-template-rows: repeat(3, 46px);
            gap: 6px;
            pointer-events: auto;
        }

        .ctrl-btn {
            background: rgba(31, 41, 55, 0.85);
            border: 1px solid #4b5563;
            color: #fff;
            border-radius: 12px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ctrl-btn:active {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-fire {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 2px solid #f87171;
            font-size: 15px;
            font-weight: bold;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .btn-fire:active {
            transform: scale(0.92);
        }

        #status-msg {
            font-size: 13px;
            color: #facc15;
            margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="lobby-screen">
        <div class="card">
            <h1>🛡️ 3D মাল্টিপ্লেয়ার ব্যাটল</h1>
            <p>দুইজন খেলোয়াড়ের রিয়েল-টাইম সাইবার ট্যাংক যুদ্ধ</p>

            <button class="btn" id="btn-create">নতুন রুম তৈরি করুন (Host)</button>
            
            <div style="font-size:12px; color:#6b7280; margin: 8px 0;">— অথবা —</div>

            <div class="input-group">
                <input type="text" id="join-code" placeholder="রুম কোড দিন" maxlength="6">
                <button class="btn btn-pink" style="margin:0; width:auto;" id="btn-join">যুক্ত হন</button>
            </div>

            <div id="status-msg"></div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-box">
            <span style="color:var(--accent-cyan);">আপনি (Blue)</span>
            <div class="bar"><div id="my-hp" class="bar-inner"></div></div>
        </div>
        <div class="hud-box" style="text-align:right;">
            <span style="color:var(--accent-pink);">প্রতিপক্ষ (Pink)</span>
            <div class="bar"><div id="enemy-hp" class="bar-inner"></div></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="dpad">
            <div></div>
            <button class="ctrl-btn" id="ctrl-up">▲</button>
            <div></div>
            <button class="ctrl-btn" id="ctrl-left">◀</button>
            <div></div>
            <button class="ctrl-btn" id="ctrl-right">▶</button>
            <div></div>
            <button class="ctrl-btn" id="ctrl-down">▼</button>
            <div></div>
        </div>
        <button class="ctrl-btn btn-fire" id="ctrl-shoot">🔥 ফায়ার</button>
    </div>

    <script>
        // --- ৩ডি সিন ইনিশিয়ালাইজেশন ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.Fog(0x050814, 20, 90);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // লাইটিং
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ব্যাটেলগ্রাউন্ড ফ্লোর ও গ্রিড
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a101f, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(100, 50, 0x06b6d4, 0x1e293b);
        gridHelper.position.y = 0.02;
        scene.add(gridHelper);

        // চারদিকের সীমানা পিলার
        function createPillar(x, z) {
            const geo = new THREE.BoxGeometry(3, 6, 3);
            const mat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 3, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        for (let i = -40; i <= 40; i += 20) {
            createPillar(i, -45);
            createPillar(i, 45);
            createPillar(-45, i);
            createPillar(45, i);
        }

        // --- ৩ডি ট্যাংক মেকার ---
        function createTank(colorHex) {
            const tankGroup = new THREE.Group();

            // বডি
            const bodyGeo = new THREE.BoxGeometry(2.4, 0.9, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            tankGroup.add(body);

            // টারেট
            const turretGeo = new THREE.CylinderGeometry(0.7, 0.8, 0.6, 16);
            const turretMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const turret = new THREE.Mesh(turretGeo, turretMat);
            turret.position.y = 1.2;
            tankGroup.add(turret);

            // কামান (Barrel)
            const barrelGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.8, 8);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x374151 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 1.2, 1.1);
            tankGroup.add(barrel);

            scene.add(tankGroup);
            return tankGroup;
        }

        const myTank = createTank(0x06b6d4); // Blue Tank
        const enemyTank = createTank(0xec4899); // Pink Tank
        enemyTank.position.set(0, 0, -25);
        enemyTank.rotation.y = Math.PI;

        // গেম স্টেট
        let myHP = 100;
        let enemyHP = 100;
        let isPlaying = false;
        let bullets = [];

        // কন্ট্রোল স্টেট
        const keys = { w: false, s: false, a: false, d: false };

        // --- বুলেট হ্যান্ডলিং ---
        function shootBullet(originPos, rotationY, isMine) {
            const geo = new THREE.SphereGeometry(0.2, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: isMine ? 0x06b6d4 : 0xec4899 });
            const bMesh = new THREE.Mesh(geo, mat);
            bMesh.position.set(originPos.x, 1.2, originPos.z);
            scene.add(bMesh);

            const speed = 1.2;
            const velocity = new THREE.Vector3(
                Math.sin(rotationY) * speed,
                0,
                Math.cos(rotationY) * speed
            );

            bullets.push({ mesh: bMesh, velocity, isMine, life: 60 });
        }

        function fire() {
            if (!isPlaying || myHP <= 0) return;
            shootBullet(myTank.position, myTank.rotation.y, true);

            // প্রতিপক্ষের কাছে বুলেটের সিগন্যাল পাঠানো
            if (conn && conn.open) {
                conn.send({
                    type: 'shoot',
                    pos: { x: myTank.position.x, z: myTank.position.z },
                    rotY: myTank.rotation.y
                });
            }
        }

        // --- রিয়েল-টাইম মাল্টিপ্লেয়ার (PeerJS) ---
        let peer = null;
        let conn = null;
        const statusMsg = document.getElementById('status-msg');

        function generateShortId() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // হোস্ট মোড
        document.getElementById('btn-create').addEventListener('click', () => {
            const roomId = generateShortId();
            statusMsg.innerText = "রুম তৈরি হচ্ছে...";
            
            peer = new Peer(roomId);
            peer.on('open', (id) => {
                statusMsg.innerHTML = `রুম কোড: <b style="color:#06b6d4; font-size:18px;">${id}</b><br>বন্ধুকে এই কোডটি দিয়ে যুক্ত হতে বলুন...`;
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        });

        // জয়েন মোড
        document.getElementById('btn-join').addEventListener('click', () => {
            const code = document.getElementById('join-code').value.trim();
            if (!code) return alert("রুম কোড লিখুন!");

            statusMsg.innerText = "সংযোগ স্থাপন করা হচ্ছে...";
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby-screen').style.display = 'none';
                isPlaying = true;

                // পজিশন ইনিশিয়ালাইজেশন
                myTank.position.set(0, 0, 20);
                myTank.rotation.y = 0;
            });

            conn.on('data', (data) => {
                if (data.type === 'sync') {
                    enemyTank.position.x = data.x;
                    enemyTank.position.z = data.z;
                    enemyTank.rotation.y = data.rotY;
                } else if (data.type === 'shoot') {
                    shootBullet(data.pos, data.rotY, false);
                } else if (data.type === 'hit') {
                    enemyHP = data.enemyHP;
                    document.getElementById('enemy-hp').style.width = `${enemyHP}%`;
                    if (enemyHP <= 0) alert("অভিনন্দন! আপনি জয়ী হয়েছেন!");
                }
            });
        }

        // ইনপুট হ্যান্ডলার (কীবোর্ড)
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (k === 's' || e.key === 'ArrowDown') keys.s = true;
            if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (e.key === ' ') fire();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (k === 's' || e.key === 'ArrowDown') keys.s = false;
            if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // মোবাইল টাচ কন্ট্রোল
        const bindKey = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindKey('ctrl-up', 'w');
        bindKey('ctrl-down', 's');
        bindKey('ctrl-left', 'a');
        bindKey('ctrl-right', 'd');
        document.getElementById('ctrl-shoot').addEventListener('touchstart', (e) => {
            e.preventDefault();
            fire();
        });

        // --- গেম ফিজিক্স ও অ্যানিমেশন লুপ ---
        let lastSyncTime = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            if (isPlaying && myHP > 0) {
                // মুভমেন্ট ও রোটেশন
                if (keys.a) myTank.rotation.y += 0.04;
                if (keys.d) myTank.rotation.y -= 0.04;

                const moveSpeed = 0.25;
                if (keys.w) {
                    myTank.position.x += Math.sin(myTank.rotation.y) * moveSpeed;
                    myTank.position.z += Math.cos(myTank.rotation.y) * moveSpeed;
                }
                if (keys.s) {
                    myTank.position.x -= Math.sin(myTank.rotation.y) * moveSpeed;
                    myTank.position.z -= Math.cos(myTank.rotation.y) * moveSpeed;
                }

                // বাউন্ডারি লক
                myTank.position.x = Math.max(-42, Math.min(42, myTank.position.x));
                myTank.position.z = Math.max(-42, Math.min(42, myTank.position.z));

                // ক্যামেরা প্লেয়ারকে ফলো করা (Third-person view)
                const camOffset = new THREE.Vector3(
                    -Math.sin(myTank.rotation.y) * 12,
                    6,
                    -Math.cos(myTank.rotation.y) * 12
                );
                camera.position.copy(myTank.position).add(camOffset);
                camera.lookAt(myTank.position.x, myTank.position.y + 1.5, myTank.position.z);

                // পজিশন ডেটা প্রতিপক্ষকে লাইভ সিঙ্ক করা (প্রতি ৩০ms পর পর)
                if (conn && conn.open && time - lastSyncTime > 30) {
                    conn.send({
                        type: 'sync',
                        x: myTank.position.x,
                        z: myTank.position.z,
                        rotY: myTank.rotation.y
                    });
                    lastSyncTime = time;
                }
            }

            // বুলেট আপডেট ও কলিশন ডিটেকশন
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.velocity);
                b.life--;

                // শত্রু ট্যাংকে নিজের বুলেটের আঘাত
                if (b.isMine) {
                    const distToEnemy = b.mesh.position.distanceTo(enemyTank.position);
                    if (distToEnemy < 2.0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        // ড্যামেজ পাঠানো
                        if (conn && conn.open) {
                            conn.send({ type: 'hit', enemyHP: Math.max(0, enemyHP - 20) });
                        }
                        continue;
                    }
                } else {
                    // প্রতিপক্ষের বুলেট নিজের গায়ে লাগা
                    const distToMe = b.mesh.position.distanceTo(myTank.position);
                    if (distToMe < 2.0) {
                        myHP = Math.max(0, myHP - 20);
                        document.getElementById('my-hp').style.width = `${myHP}%`;
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if (myHP <= 0) alert("আপনার ট্যাংক ধ্বংস হয়ে গেছে! গেম ওভার!");
                        continue;
                    }
                }

                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // উইন্ডো রিসাইজ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(0);
    </script>
</body>
</html>
