<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বাংলা সাধারণ জ্ঞান কুইজ - aionline.in.net</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --correct: #22c55e;
            --wrong: #ef4444;
            --gold: #facc15;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .header {
            margin-bottom: 12px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            color: var(--accent);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .header a {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        #quiz-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .timer-badge {
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.1s linear;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 52px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .option-btn {
            background: #0f172a;
            color: #e2e8f0;
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #162032;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--correct) !important;
            color: #4ade80 !important;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--wrong) !important;
            color: #f87171 !important;
        }

        #quiz-modal {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 20;
        }

        #quiz-modal h2 {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        #quiz-modal p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .btn-start {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 বাংলা সাধারণ জ্ঞান কুইজ</h1>
        <a href="https://aionline.in.net" target="_blank">aionline.in.net</a>
    </div>

    <div id="quiz-card">
        <div class="quiz-header">
            <span id="question-count">প্রশ্ন: ১/১০</span>
            <span class="timer-badge" id="timer-text">১৫ সে.</span>
        </div>

        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>

        <div class="question-text" id="question-text">প্রশ্ন লোড হচ্ছে...</div>

        <div class="options-list" id="options-container"></div>

        <div id="quiz-modal">
            <h2 id="modal-title">জ্ঞান যাচাই করুন!</h2>
            <p id="modal-desc">
                বিশাল প্রশ্নব্যাংক থেকে এলোমেলোভাবে ১০টি প্রশ্ন আসবে।<br>
                প্রতি প্রশ্নের উত্তর দেওয়ার জন্য ১৫ সেকেন্ড সময় পাবেন!
            </p>
            <button class="btn-start" id="start-btn">কুইজ শুরু করুন</button>
        </div>
    </div>

    <script>
        // ৫০টি বৈচিত্র্যময় প্রশ্নের ব্যাংক
        const masterQuestions = [
            { q: "সৌরজগতের সবচেয়ে বড় গ্রহ কোনটি?", o: ["মঙ্গল", "বৃহস্পতি", "শনি", "শুক্র"], a: 1 },
            { q: "মানবদেহের সবচেয়ে বড় অঙ্গ (Organ) কোনটি?", o: ["যকৃত (Liver)", "হৃৎপিণ্ড", "ত্বক (Skin)", "ফুসফুস"], a: 2 },
            { q: "কোন দেশকে 'সূর্যোদয়ের দেশ' বলা হয়?", o: ["জাপান", "নরওয়ে", "চীন", "অস্ট্রেলিয়া"], a: 0 },
            { q: "আধুনিক কম্পিউটারের জনক কাকে বলা হয়?", o: ["অ্যালান টুরিং", "চার্লস ব্যাবেজ", "বিল গেটস", "স্টিভ জবস"], a: 1 },
            { q: "পৃথিবীর সবচেয়ে গভীরতম সমুদ্র খাত কোনটি?", o: ["জাভা খাত", "পুয়ের্তো রিকো", "মারিয়ানা খাত", "রোমানশ"], a: 2 },
            { q: "বায়ুমণ্ডলে কোন গ্যাসের পরিমাণ সবচেয়ে বেশি?", o: ["অক্সিজেন", "নাইট্রোজেন", "কার্বন ডাই অক্সাইড", "হাইড্রোজেন"], a: 1 },
            { q: "আলোর গতি প্রতি সেকেন্ডে প্রায় কত কিলোমিটার?", o: ["১,৫০,০০০ কি.মি.", "২,০০,০০০ কি.মি.", "৩,০০,০০০ কি.মি.", "৩,৫০,০০০ কি.মি."], a: 2 },
            { q: "রক্ত জমাট বাঁধতে কোন ভিটামিন সাহায্য করে?", o: ["ভিটামিন A", "ভিটামিন K", "ভিটামিন C", "ভিটামিন D"], a: 1 },
            { q: "কোন প্রাণী দাঁড়িয়ে ঘুমায়?", o: ["ঘোড়া", "গরু", "সিংহ", "ভাল্লুক"], a: 0 },
            { q: "বিশ্বের বৃহত্তম মরুভূমি কোনটি?", o: ["সাহারা", "গোবি", "থর", "অ্যান্টার্কটিকা"], a: 3 },
            { q: "পেনিসিলিন কে আবিষ্কার করেন?", o: ["আলেকজান্ডার ফ্লেমিং", "লুই পাস্তুর", "রবার্ট হুক", "এডওয়ার্ড জেনার"], a: 0 },
            { q: "কোন ভিটামিনের অভাবে রাতকানা রোগ হয়?", o: ["ভিটামিন B", "ভিটামিন C", "ভিটামিন A", "ভিটামিন D"], a: 2 },
            { q: "মানুষের হৃৎপিণ্ডে কয়টি প্রকোষ্ঠ (Chamber) থাকে?", o: ["২টি", "৩টি", "৪টি", "৫টি"], a: 2 },
            { q: "নোবেল পুরস্কার কয়টি বিষয়ে প্রদান করা হয়?", o: ["৫টি", "৬টি", "৭টি", "৮টি"], a: 1 },
            { q: "আন্তর্জাতিক নারী দিবস কোন তারিখে পালিত হয়?", o: ["৮ মার্চ", "১০ এপ্রিল", "১ মে", "১৫ আগস্ট"], a: 0 },
            { q: "বিশ্বের দীর্ঘতম নদী কোনটি?", o: ["আমাজন", "নীলনদ", "ইয়াংসিকিয়াং", "মিসিসিপি"], a: 1 },
            { q: "হিমোগ্লোবিনের প্রধান কাজ কী?", o: ["অক্সিজেন পরিবহন", "রোগ প্রতিরোধ", "রক্ত জমাট বাঁধা", "তাপ নিয়ন্ত্রণ"], a: 0 },
            { q: "কাগজ প্রথম কোন দেশে আবিষ্কৃত হয়?", o: ["ভারত", "মিশর", "চীন", "গ্রিস"], a: 2 },
            { q: "সূর্যের সবচেয়ে কাছের গ্রহ কোনটি?", o: ["বুধ", "শুক্র", "পৃথিবী", "মঙ্গল"], a: 0 },
            { q: "ডিএনএ (DNA)-এর পূর্ণরূপ কী?", o: ["Deoxyribonucleic Acid", "Diribo Nucleic Acid", "Dioxy Nitrogen Acid", "Dynamic Nucleic Acid"], a: 0 },
            { q: "বিশ্ব পরিবেশ দিবস কোন তারিখে পালিত হয়?", o: ["৫ জুন", "২২ এপ্রিল", "১ ডিসেম্বর", "১৬ সেপ্টেম্বর"], a: 0 },
            { q: "ভূমিকম্প পরিমাপক যন্ত্রের নাম কী?", o: ["সিসমোগ্রাফ", "ব্যারোমিটার", "অ্যালটিমিটার", "ক্রোনোমিটার"], a: 0 },
            { q: "কোন রঙের আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে বেশি?", o: ["নীল", "সবুজ", "লাল", "হলুদ"], a: 2 },
            { q: "মানবদেহের স্বাভাবিক তাপমাত্রা কত ডিগ্রি ফারেনহাইট?", o: ["৯৬.৪°F", "৯৮.৪°F বা ৯৮.৬°F", "১০০°F", "৯৭.২°F"], a: 1 },
            { q: "আইফেল টাওয়ার কোন শহরে অবস্থিত?", o: ["লন্ডন", "রোম", "প্যারিস", "বার্লিন"], a: 2 },
            { q: "কোন মহাসাগরের আয়তন সবচেয়ে বড়?", o: ["আটলান্টিক", "প্রশান্ত", "ভারত", "উত্তর মহাসাগর"], a: 1 },
            { q: "টেলিফোন কে আবিষ্কার করেন?", o: ["টমাস আলভা এডিসন", "আলেকজান্ডার গ্রাহাম বেল", "গুগলিয়েলমো মার্কনি", "নিকোলা টেসলা"], a: 1 },
            { q: "শব্দের গতি কোন মাধ্যমে সবচেয়ে বেশি?", o: ["বায়ু", "পানি", "কঠিন মাধ্যম (যেমন লোহা)", "শূন্যস্থান"], a: 2 },
            { q: "কোন মহাদেশে কোনো মরুভূমি নেই?", o: ["ইউরোপ", "উত্তর আমেরিকা", "অস্ট্রেলিয়া", "দক্ষিণ আমেরিকা"], a: 0 },
            { q: "সোনার রাসায়নিক প্রতীক কী?", o: ["Ag", "Au", "Fe", "Cu"], a: 1 },
            { q: "অলিম্পিক পতাকায় কয়টি রিং থাকে?", o: ["৪টি", "৫টি", "৬টি", "৭টি"], a: 1 },
            { q: "পানিতে দ্রবণীয় ভিটামিন কোনটি?", o: ["ভিটামিন A", "ভিটামিন C", "ভিটামিন D", "ভিটামিন K"], a: 1 },
            { q: "ভারতের প্রথম কৃত্রিম উপগ্রহের নাম কী?", o: ["ভাস্কর", "আর্যভট্ট", "রোহিণী", "ইনস্যাট"], a: 1 },
            { q: "মানুষের মুখে মোট কয়টি স্থায়ী দাঁত থাকে?", o: ["২৮টি", "৩০টি", "৩২টি", "৩৪টি"], a: 2 },
            { q: "বিশ্ব স্বাস্থ্য সংস্থা (WHO)-এর সদর দপ্তর কোথায়?", o: ["জেনেভা", "নিউইয়র্ক", "প্যারিস", "ভিয়েনা"], a: 0 },
            { q: "বিদ্যুৎ প্রবাহের একক কী?", o: ["ভোল্ট", "ওয়াট", "অ্যাম্পিয়ার", "ওহম"], a: 2 },
            { q: "কোন গ্রহকে 'লাল গ্রহ' (Red Planet) বলা হয়?", o: ["বুধ", "মঙ্গল", "বৃহস্পতি", "শনি"], a: 1 },
            { q: "কম্পিউটারের 'মস্তিষ্ক' কাকে বলা হয়?", o: ["RAM", "CPU", "Hard Disk", "Motherboard"], a: 1 },
            { q: "রবীন্দ্রনাথ ঠাকুর কত সালে নোবেল পুরস্কার পান?", o: ["১৯১১", "১৯১৩", "১৯১৯", "১৯২১"], a: 1 },
            { q: "সবচেয়ে হালকা গ্যাস কোনটি?", o: ["হিলিয়াম", "হাইড্রোজেন", "অক্সিজেন", "নাইট্রোজেন"], a: 1 },
            { q: "বিশ্বের প্রথম দেশ হিসেবে চাঁদের দক্ষিণ মেরুতে কে পৌঁছায়?", o: ["যুক্তরাষ্ট্র", "চীন", "ভারত", "রাশিয়া"], a: 2 },
            { q: "ইউনেস্কোর সদর দপ্তর কোথায় অবস্থিত?", o: ["প্যারিস", "রোম", "জেনেভা", "লন্ডন"], a: 0 },
            { q: "মানবদেহের সবচেয়ে ছোট হাড়টির নাম কী?", o: ["ফিমার", "স্টেপিস (কানে)", "টিবিয়া", "রেডিয়াস"], a: 1 },
            { q: "বায়ুর চাপ মাপার যন্ত্রের নাম কী?", o: ["ব্যারোমিটার", "হাইড্রোমিটার", "থার্মোমিটার", "অ্যানিমোমিটার"], a: 0 },
            { q: "কোন ভিটামিন সূর্যের আলো থেকে পাওয়া যায়?", o: ["ভিটামিন A", "ভিটামিন B", "ভিটামিন C", "ভিটামিন D"], a: 3 },
            { q: "ফুটবল বিশ্বকাপ প্রথম কবে অনুষ্ঠিত হয়?", o: ["১৯৩০", "১৯৩৮", "১৯৫০", "১৯৬০"], a: 0 },
            { q: "পৃথিবীর সবচেয়ে উঁচু পর্বতশৃঙ্গ কোনটি?", o: ["কে-টু", "মাউন্ট এভারেস্ট", "কাঞ্চনজঙ্ঘা", "লোৎসে"], a: 1 },
            { q: "হীরক (Diamond) কোন মৌলের রূপভেদ?", o: ["সিলিকন", "কার্বন", "সালফার", "ফসফরাস"], a: 1 },
            { q: "আন্তর্জাতিক মাতৃভাষা দিবস কোন তারিখে পালিত হয়?", o: ["২১ ফেব্রুয়ারি", "২৬ মার্চ", "১৬ ডিসেম্বর", "১ মে"], a: 0 },
            { q: "সবচেয়ে দ্রুতগতির স্থলচর প্রাণী কোনটি?", o: ["সিংহ", "চিতাবাঘ", "হরিণ", "ঘোড়া"], a: 1 }
        ];

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCount = document.getElementById('question-count');
        const timerText = document.getElementById('timer-text');
        const progressBar = document.getElementById('progress-bar');
        const modal = document.getElementById('quiz-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const startBtn = document.getElementById('start-btn');

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timer = null;
        const TIME_LIMIT = 15;

        // অ্যারে এলোমেলো (Shuffle) করার ফাংশন
        function shuffleArray(arr) {
            return arr.slice().sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            clearInterval(timer);
            const currentQuiz = activeQuestions[currentQuestionIndex];
            
            questionCount.innerText = `প্রশ্ন: ${currentQuestionIndex + 1}/${activeQuestions.length}`;
            questionText.innerText = `${currentQuestionIndex + 1}. ${currentQuiz.q}`;
            optionsContainer.innerHTML = '';

            currentQuiz.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span><span style="opacity:0.5;">#${index + 1}</span>`;
                btn.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            let timeLeft = TIME_LIMIT;
            timerText.innerText = `${timeLeft} সে.`;
            progressBar.style.width = '100%';

            const startTime = Date.now();
            timer = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, TIME_LIMIT - elapsed);
                
                timerText.innerText = `${Math.ceil(remaining)} সে.`;
                progressBar.style.width = `${(remaining / TIME_LIMIT) * 100}%`;

                if (remaining <= 0) {
                    clearInterval(timer);
                    highlightCorrectAnswer();
                    setTimeout(nextQuestion, 1200);
                }
            }, 100);
        }

        function selectAnswer(selectedIndex) {
            clearInterval(timer);
            const currentQuiz = activeQuestions[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('.option-btn');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuiz.a) {
                buttons[selectedIndex].classList.add('correct');
                score++;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[currentQuiz.a].classList.add('correct');
            }

            setTimeout(nextQuestion, 1200);
        }

        function highlightCorrectAnswer() {
            const currentQuiz = activeQuestions[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            buttons[currentQuiz.a].classList.add('correct');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            let feedback = "";
            if (score === 10) feedback = "অবিশ্বাস্য! আপনি সাধারণ জ্ঞানে একজন পণ্ডিত! 🏆";
            else if (score >= 7) feedback = "খুব চমৎকার ফলাফল! আপনার প্রস্তুতি বেশ ভালো! 🌟";
            else if (score >= 4) feedback = "ভালো চেষ্টা! আরও কিছুটা অনুশীলনে দারুণ করবেন। 👍";
            else feedback = "আবার খেলুন, প্রতি রাউন্ডেই নতুন প্রশ্ন শিখে সাধারণ জ্ঞান সমৃদ্ধ হবে! 📚";

            modalTitle.innerText = "কুইজ ফলাফল!";
            modalDesc.innerHTML = `আপনার মোট স্কোর: <b style="color:var(--gold); font-size:20px;">${score} / ${activeQuestions.length}</b><br><br>${feedback}`;
            startBtn.innerText = "নতুন প্রশ্ন নিয়ে খেলুন";
            modal.style.display = 'flex';
        }

        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            // প্রতিবার ৫০টি প্রশ্ন থেকে এলোমেলোভাবে ১০টি প্রশ্ন বাছাই
            activeQuestions = shuffleArray(masterQuestions).slice(0, 10);
            modal.style.display = 'none';
            loadQuestion();
        }

        startBtn.addEventListener('click', startQuiz);
    </script>
</body>
</html>
