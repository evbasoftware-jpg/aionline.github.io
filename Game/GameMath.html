<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>গণিত চ্যালেঞ্জ - aionline.in.net</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --correct: #22c55e;
            --wrong: #ef4444;
            --gold: #f59e0b;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .header {
            margin-bottom: 12px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            color: var(--accent);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .header a {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        #game-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* স্ট্যাটাস ও স্কোরবার */
        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .timer-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.1s linear;
        }

        /* প্রশ্ন প্রদর্শন */
        .question-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            padding: 24px 10px;
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 2px;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.15s, border-color 0.15s;
        }

        /* উত্তর অপশন গ্রিড */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .opt-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #3b82f6;
            border-radius: 14px;
            padding: 16px 0;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .opt-btn:active {
            transform: scale(0.95);
        }

        .opt-btn.correct {
            background: var(--correct) !important;
            border-color: #86efac !important;
            color: #064e3b !important;
        }

        .opt-btn.wrong {
            background: var(--wrong) !important;
            border-color: #fca5a5 !important;
            color: #ffffff !important;
        }

        /* মোডাল */
        #game-modal {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.94);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        #game-modal h2 {
            font-size: 26px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        #game-modal p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-start {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 স্পিড ম্যাথ চ্যালেঞ্জ</h1>
        <a href="https://aionline.in.net" target="_blank">aionline.in.net</a>
    </div>

    <div id="game-card">
        
        <div class="status-bar">
            <div>জীবন: <span id="lives-display">❤️❤️❤️</span></div>
            <div>স্কোর: <span id="score-display" style="color:var(--gold);">0</span></div>
        </div>

        <div class="timer-container">
            <div id="timer-bar"></div>
        </div>

        <div class="question-box" id="question">12 + 8</div>

        <div class="options-grid">
            <button class="opt-btn" onclick="checkAnswer(0)"></button>
            <button class="opt-btn" onclick="checkAnswer(1)"></button>
            <button class="opt-btn" onclick="checkAnswer(2)"></button>
            <button class="opt-btn" onclick="checkAnswer(3)"></button>
        </div>

        <div id="game-modal">
            <h2 id="modal-title">মস্তিষ্কের পরীক্ষা!</h2>
            <p id="modal-desc">
                দ্রুত সময়ের মধ্যে সঠিক হিসাব বের করুন।<br>
                সময় শেষ হলে বা ৩টি ভুল উত্তর দিলে খেলা শেষ হবে!
            </p>
            <button class="btn-start" id="start-btn">শুরু করুন</button>
        </div>

    </div>

    <script>
        const questionElem = document.getElementById('question');
        const scoreElem = document.getElementById('score-display');
        const livesElem = document.getElementById('lives-display');
        const timerBar = document.getElementById('timer-bar');
        const modal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const startBtn = document.getElementById('start-btn');
        const optButtons = document.querySelectorAll('.opt-btn');

        let score = 0;
        let lives = 3;
        let isRunning = false;
        let correctAnswer = 0;
        let questionTimer = null;
        const TIME_LIMIT = 5000; // প্রতি প্রশ্নের জন্য ৫ সেকেন্ড
        let startTime = 0;

        function generateQuestion() {
            if (!isRunning) return;

            // পর্যায়ক্রমে প্রশ্ন কঠিন হবে (যোগ, বিয়োগ এবং গুণ)
            const operators = ['+', '-', '×'];
            let op = operators[Math.floor(Math.random() * (score > 100 ? 3 : 2))];

            let n1, n2;

            if (op === '+') {
                n1 = Math.floor(Math.random() * 30) + 5;
                n2 = Math.floor(Math.random() * 30) + 5;
                correctAnswer = n1 + n2;
            } else if (op === '-') {
                n1 = Math.floor(Math.random() * 40) + 15;
                n2 = Math.floor(Math.random() * (n1 - 5)) + 1; // উত্তর ধনাত্মক থাকবে
                correctAnswer = n1 - n2;
            } else {
                n1 = Math.floor(Math.random() * 11) + 2;
                n2 = Math.floor(Math.random() * 9) + 2;
                correctAnswer = n1 * n2;
            }

            questionElem.innerText = `${n1} ${op} ${n2}`;

            // বিকল্প উত্তর তৈরি করা
            let answers = [correctAnswer];
            while (answers.length < 4) {
                let delta = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let fake = correctAnswer + delta;
                if (fake >= 0 && !answers.includes(fake)) {
                    answers.push(fake);
                }
            }

            // অপশনগুলো এলোমেলো করা (Shuffle)
            answers.sort(() => Math.random() - 0.5);

            optButtons.forEach((btn, idx) => {
                btn.innerText = answers[idx];
                btn.dataset.val = answers[idx];
                btn.className = 'opt-btn';
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(questionTimer);
            startTime = Date.now();

            questionTimer = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, 1 - elapsed / TIME_LIMIT);
                timerBar.style.width = `${remaining * 100}%`;

                if (remaining <= 0) {
                    clearInterval(questionTimer);
                    handleWrongAnswer();
                }
            }, 50);
        }

        function checkAnswer(index) {
            if (!isRunning) return;
            clearInterval(questionTimer);

            const selectedBtn = optButtons[index];
            const val = parseInt(selectedBtn.dataset.val);

            if (val === correctAnswer) {
                selectedBtn.classList.add('correct');
                score += 10;
                scoreElem.innerText = score;
                setTimeout(generateQuestion, 300);
            } else {
                selectedBtn.classList.add('wrong');
                optButtons.forEach(btn => {
                    if (parseInt(btn.dataset.val) === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
                setTimeout(handleWrongAnswer, 500);
            }
        }

        function handleWrongAnswer() {
            lives--;
            updateLivesUI();

            if (lives <= 0) {
                gameOver();
            } else {
                generateQuestion();
            }
        }

        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            livesElem.innerText = hearts || '💔';
        }

        function resetGame() {
            score = 0;
            lives = 3;
            scoreElem.innerText = score;
            updateLivesUI();
            isRunning = true;
            modal.style.display = 'none';
            generateQuestion();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(questionTimer);
            modalTitle.innerText = "খেলা সমাপ্ত!";
            modalDesc.innerText = `সময় শেষ অথবা ৩টি ভুল হয়েছে!\nআপনার স্কোর: ${score} পয়েন্ট।`;
            startBtn.innerText = "আবার খেলুন";
            modal.style.display = 'flex';
        }

        startBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
