<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মিনি অ্যারেনা ব্যাটল - aionline.in.net</title>
    <style>
        :root {
            --bg-dark: #080c14;
            --accent: #f59e0b;
            --accent-blue: #38bdf8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            margin-bottom: 8px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            letter-spacing: 1px;
        }

        .header a {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        #arena-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 480px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(245, 158, 11, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* স্ট্যাটাস ও স্কোরবার */
        #hud {
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 1px 4px #000;
        }

        .hp-bar-bg {
            width: 110px;
            height: 12px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #64748b;
        }

        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            transition: width 0.15s ease;
        }

        /* মোডাল */
        #game-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 20, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 50;
        }

        #game-modal h2 {
            font-size: 26px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        #game-modal p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-start {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        /* কন্ট্রোল প্যাড (মোবাইল) */
        .controls-layer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 440px;
            margin-top: 10px;
            padding: 0 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 4px;
        }

        .d-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .d-btn:active {
            background: #38bdf8;
            color: #0b0f19;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .act-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .act-btn:active {
            transform: scale(0.92);
        }

        .btn-sword { background: linear-gradient(135deg, #ef4444, #b91c1c); border: 2px solid #fca5a5; }
        .btn-fire  { background: linear-gradient(135deg, #f59e0b, #d97706); border: 2px solid #fde68a; }
        .btn-dash  { background: linear-gradient(135deg, #0284c7, #0369a1); border: 2px solid #7dd3fc; }
    </style>
</head>
<body>

    <div class="header">
        <h1>মিনি অ্যারেনা ব্যাটল (Mini Arena)</h1>
        <a href="https://aionline.in.net" target="_blank">aionline.in.net</a>
    </div>

    <div id="arena-container">
        <canvas id="arenaCanvas" width="440" height="480"></canvas>
        
        <div id="hud">
            <div>
                <span style="font-size:11px; color:#cbd5e1;">HERO HP</span>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill" id="hp-bar"></div>
                </div>
            </div>
            <div>কিল: <span id="kill-count" style="color:var(--accent);">0</span></div>
            <div>ওয়েভ: <span id="wave-count" style="color:var(--accent-blue);">1</span></div>
        </div>

        <div id="game-modal">
            <h2 id="modal-title">অ্যারেনায় স্বাগতম!</h2>
            <p id="modal-desc">
                চারদিক থেকে দানবরা আক্রমণ করতে আসবে!<br>
                তলোয়ার ও ম্যাজিক ফায়ারবল দিয়ে নিজেকে রক্ষা করুন।<br><br>
                <small style="color:#94a3b8;">PC: <b>W/A/S/D</b> বা Arrow দিয়ে মুভ, <b>J</b> তলোয়ার, <b>K</b> ফায়ারবল, <b>Space</b> ড্যাশ</small>
            </p>
            <button class="btn-start" id="start-btn">যুদ্ধ শুরু করুন</button>
        </div>
    </div>

    <!-- মোবাইল স্পর্শ কন্ট্রোল -->
    <div class="controls-layer">
        <div class="dpad">
            <div></div>
            <button class="d-btn" id="d-up">▲</button>
            <div></div>
            <button class="d-btn" id="d-left">◀</button>
            <div></div>
            <button class="d-btn" id="d-right">▶</button>
            <div></div>
            <button class="d-btn" id="d-down">▼</button>
            <div></div>
        </div>

        <div class="action-btns">
            <button class="act-btn btn-dash" id="btn-dash">⚡<span style="font-size:10px;">ড্যাশ</span></button>
            <button class="act-btn btn-fire" id="btn-fire">🔥<span style="font-size:10px;">ফায়ার</span></button>
            <button class="act-btn btn-sword" id="btn-sword">⚔️<span style="font-size:10px;">সোর্ড</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('arenaCanvas');
        const ctx = canvas.getContext('2d');

        const hpBar = document.getElementById('hp-bar');
        const killText = document.getElementById('kill-count');
        const waveText = document.getElementById('wave-count');
        const modal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const startBtn = document.getElementById('start-btn');

        let isRunning = false;
        let kills = 0;
        let wave = 1;
        let frameCount = 0;

        // প্লেয়ার অবজেক্ট
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 14,
            speed: 3.2,
            hp: 100,
            maxHp: 100,
            angle: 0,
            dashCooldown: 0,
            isSlashing: false,
            slashTimer: 0,
            keys: { up: false, down: false, left: false, right: false }
        };

        let enemies = [];
        let projectiles = [];
        let particles = [];

        // স্পন এনিমি
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * canvas.width; y = -20; }
            else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
            else { x = -20; y = Math.random() * canvas.height; }

            const isTank = Math.random() < 0.2;
            enemies.push({
                x, y,
                radius: isTank ? 18 : 12,
                speed: isTank ? 1.2 : (1.8 + Math.random() * 0.8),
                hp: isTank ? 60 : 25,
                maxHp: isTank ? 60 : 25,
                color: isTank ? '#a855f7' : '#ef4444',
                damage: isTank ? 18 : 10
            });
        }

        // পার্টিকেল ইফেক্ট
        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // আক্রমণ ফাংশনস
        function slashAttack() {
            if (!isRunning || player.isSlashing) return;
            player.isSlashing = true;
            player.slashTimer = 10;

            createExplosion(
                player.x + Math.cos(player.angle) * 20,
                player.y + Math.sin(player.angle) * 20,
                '#38bdf8', 15
            );

            // তলোয়ারের রেঞ্জে শত্রু ধ্বংস
            enemies.forEach(enemy => {
                const dx = enemy.x - player.x;
                const dy = enemy.y - player.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 55) {
                    enemy.hp -= 35;
                    createExplosion(enemy.x, enemy.y, '#f59e0b', 8);
                }
            });
        }

        function shootFireball() {
            if (!isRunning) return;
            projectiles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 7,
                vy: Math.sin(player.angle) * 7,
                radius: 6,
                life: 60
            });
        }

        function triggerDash() {
            if (!isRunning || player.dashCooldown > 0) return;
            player.x += Math.cos(player.angle) * 60;
            player.y += Math.sin(player.angle) * 60;
            player.dashCooldown = 120; // ২ সেকেন্ড কুলডাউন
            createExplosion(player.x, player.y, '#38bdf8', 20);
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;
            enemies = [];
            projectiles = [];
            particles = [];
            kills = 0;
            wave = 1;
            frameCount = 0;
            isRunning = true;
            modal.style.display = 'none';
            updateHUD();
        }

        function gameOver() {
            isRunning = false;
            createExplosion(player.x, player.y, '#ef4444', 35);
            modalTitle.innerText = "বীরযোদ্ধার পতন!";
            modalDesc.innerText = `আপনি সফলভাবে ${kills} জন শত্রুকে পরাজিত করেছেন এবং ওয়েভ ${wave} পর্যন্ত টিকে ছিলেন!`;
            startBtn.innerText = "পুনরায় চেষ্টা করুন";
            modal.style.display = 'flex';
        }

        function updateHUD() {
            const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            hpBar.style.width = `${hpPercent}%`;
            killText.innerText = kills;
            waveText.innerText = wave;
        }

        // ইনপুট হ্যান্ডলিং (পিসি)
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') player.keys.up = true;
            if (k === 's' || e.key === 'ArrowDown') player.keys.down = true;
            if (k === 'a' || e.key === 'ArrowLeft') player.keys.left = true;
            if (k === 'd' || e.key === 'ArrowRight') player.keys.right = true;
            if (k === 'j') slashAttack();
            if (k === 'k') shootFireball();
            if (e.key === ' ') triggerDash();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') player.keys.up = false;
            if (k === 's' || e.key === 'ArrowDown') player.keys.down = false;
            if (k === 'a' || e.key === 'ArrowLeft') player.keys.left = false;
            if (k === 'd' || e.key === 'ArrowRight') player.keys.right = false;
        });

        // মোবাইল বাটন বাইন্ড
        const bindDPad = (id, key) => {
            const el = document.getElementById(id);
            const setKey = (val) => { player.keys[key] = val; };
            el.addEventListener('touchstart', (e) => { e.preventDefault(); setKey(true); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); setKey(false); });
            el.addEventListener('mousedown', () => setKey(true));
            el.addEventListener('mouseup', () => setKey(false));
        };

        bindDPad('d-up', 'up');
        bindDPad('d-down', 'down');
        bindDPad('d-left', 'left');
        bindDPad('d-right', 'right');

        document.getElementById('btn-sword').addEventListener('click', slashAttack);
        document.getElementById('btn-fire').addEventListener('click', shootFireball);
        document.getElementById('btn-dash').addEventListener('click', triggerDash);
        startBtn.addEventListener('click', resetGame);

        function update() {
            if (!isRunning) return;
            frameCount++;

            // মুভমেন্ট ক্যালকুলেশন
            let dx = 0, dy = 0;
            if (player.keys.up) dy -= 1;
            if (player.keys.down) dy += 1;
            if (player.keys.left) dx -= 1;
            if (player.keys.right) dx += 1;

            if (dx !== 0 || dy !== 0) {
                player.angle = Math.atan2(dy, dx);
                player.x += Math.cos(player.angle) * player.speed;
                player.y += Math.sin(player.angle) * player.speed;
            }

            // বাউন্ডারি চেক
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            if (player.dashCooldown > 0) player.dashCooldown--;
            if (player.slashTimer > 0) player.slashTimer--;
            else player.isSlashing = false;

            // ওয়েভ ও এনিমি স্পন
            if (frameCount % Math.max(30, 90 - wave * 10) === 0) spawnEnemy();
            if (frameCount % 600 === 0) {
                wave++;
                updateHUD();
            }

            // প্রজেক্টাইল আপডেট
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                // শত্রু কলিশন
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + p.radius) {
                        e.hp -= 25;
                        createExplosion(p.x, p.y, '#f59e0b', 8);
                        projectiles.splice(i, 1);
                        break;
                    }
                }

                if (p.life <= 0 && projectiles[i]) projectiles.splice(i, 1);
            }

            // এনিমি মুভমেন্ট ও আক্রমণ
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // প্লেয়ারে আঘাত
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    player.hp -= e.damage * 0.1;
                    updateHUD();
                    if (player.hp <= 0) {
                        gameOver();
                        return;
                    }
                }

                // এনিমি মৃত্যু
                if (e.hp <= 0) {
                    createExplosion(e.x, e.y, e.color, 16);
                    enemies.splice(i, 1);
                    kills++;
                    updateHUD();
                }
            }

            // পার্টিকেল আপডেট
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // অ্যারেনা গ্রিড ফ্লোর
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 35;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // পার্টিকেল ড্র
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // ফায়ারবল প্রজেক্টাইল
            projectiles.forEach(p => {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f59e0b';
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // শত্রু ড্র
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();

                // HP বার
                ctx.fillStyle = '#334155';
                ctx.fillRect(e.x - 12, e.y - e.radius - 8, 24, 4);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(e.x - 12, e.y - e.radius - 8, (e.hp / e.maxHp) * 24, 4);
            });

            // প্লেয়ার ড্র
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // হিরোর বডি
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#38bdf8';
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // চোখের দিক/দিকনির্দেশক
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.radius - 4, -3, 6, 6);

            // সোর্ড স্ল্যাশ অ্যানিমেশন
            if (player.isSlashing) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(0, 0, 45, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
