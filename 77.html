<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>সহজ খেলার মাঠ পরিমাপক</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #14532d;
            --accent: #facc15;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #000; color: #0f172a; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* টপ বার */
        .top-bar {
            background: #0f172a;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }
        .mode-tabs { display: flex; gap: 4px; background: #1e293b; padding: 3px; border-radius: 8px; }
        .tab-btn {
            border: none; background: transparent; color: #cbd5e1; padding: 6px 9px;
            font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer;
        }
        .tab-btn.active { background: var(--primary); color: #fff; }

        .gps-badge {
            font-size: 11px; padding: 4px 9px; border-radius: 12px;
            background: #334155; color: #fde047; font-weight: 700;
        }
        .gps-badge.good { background: #064e3b; color: #6ee7b7; }

        /* আকৃতি নির্বাচন বার */
        .shape-bar {
            display: flex; gap: 6px; padding: 7px 10px; background: #111827;
            overflow-x: auto; z-index: 900;
        }
        .shape-btn {
            padding: 6px 12px; border-radius: 16px; border: 1px solid #374151;
            background: #1f2937; color: #f3f4f6; font-size: 12px; font-weight: 700;
            white-space: nowrap; cursor: pointer;
        }
        .shape-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* ভিউপোর্ট (ক্যামেরা / ছবি / ম্যাপ) */
        .viewport { position: relative; flex: 1; width: 100%; overflow: hidden; background: #000; }
        video#cameraFeed { width: 100%; height: 100%; object-fit: cover; display: block; }
        img#photoCanvasImg { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
        #leafletMap { width: 100%; height: 100%; display: none; z-index: 5; }
        canvas#overlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }

        /* মাঝখানের টাচযোগ্য লাল ডট (পয়েন্ট দেওয়ার মূল বাটন) */
        .center-red-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 54px; height: 54px; border-radius: 50%;
            border: 3px solid rgba(250, 204, 21, 0.9);
            background: rgba(220, 38, 38, 0.25);
            display: flex; align-items: center; justify-content: center;
            z-index: 25; cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s;
        }
        .center-red-dot:active { transform: translate(-50%, -50%) scale(0.88); }
        .center-red-dot .inner-dot {
            width: 22px; height: 22px; background: #ef4444;
            border: 2.5px solid #ffffff; border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .tap-hint-pill {
            position: absolute; top: calc(50% + 34px); left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.72); color: #fde047; font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 12px; pointer-events: none; z-index: 24; white-space: nowrap;
        }

        /* নিচের সহজ কন্ট্রোল বাটন (পেছনে, মুছুন, ছবি তুলুন) */
        .floating-actions {
            position: absolute; bottom: 10px; right: 10px;
            display: flex; gap: 6px; z-index: 30;
        }
        .f-btn {
            padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25);
            background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 12px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 4px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }
        .f-btn.photo-btn { background: #0284c7; border-color: #38bdf8; }

        /* একদম নিচের সাদা ফলাফল ও নির্দেশনা প্যানেল (২য় ছবির মতো) */
        .bottom-sheet {
            background: #ffffff;
            color: #0f172a;
            border-top: 3px solid var(--primary);
            padding: 12px 14px;
            z-index: 1000;
            max-height: 44vh;
            overflow-y: auto;
        }
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sheet-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .point-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: #dcfce7;
            padding: 3px 9px;
            border-radius: 12px;
        }

        /* ২য় ছবির মতো ২ কলামের পরিমাপ কার্ড */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .measure-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 8px 11px;
        }
        .measure-card .label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            display: block;
        }
        .measure-card .value {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 2px;
            display: block;
        }

        /* একদম নিচের সহজ নির্দেশনা লেখা */
        .guide-footer {
            font-size: 13px;
            line-height: 1.5;
            color: #334155;
            background: #f1f5f9;
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>

<!-- উপরের মোড বার -->
<div class="top-bar">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabCamera" onclick="switchMode('camera')">📷 ক্যামেরা AR</button>
        <button class="tab-btn" id="tabPhoto" onclick="switchMode('photo')">🖼️ মাঠের ছবি</button>
        <button class="tab-btn" id="tabMap" onclick="switchMode('map')">🗺️ GPS ম্যাপ</button>
    </div>
    <div class="gps-badge" id="gpsBadge">📡 GPS খুঁজছে...</div>
</div>

<!-- ৫টি আকৃতি নির্বাচন -->
<div class="shape-bar">
    <button class="shape-btn active" data-shape="line" onclick="setShape('line')">১) সোজা দাগ</button>
    <button class="shape-btn" data-shape="triangle" onclick="setShape('triangle')">২) ত্রিভুজ</button>
    <button class="shape-btn" data-shape="quad" onclick="setShape('quad')">৩) চতুর্ভুজ</button>
    <button class="shape-btn" data-shape="circle" onclick="setShape('circle')">৪) গোল (বৃত্ত)</button>
    <button class="shape-btn" data-shape="polygon" onclick="setShape('polygon')">৫) অন্যান্য</button>
</div>

<!-- মূল ক্যামেরা / ছবি / ম্যাপ ভিউ -->
<div class="viewport">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <img id="photoCanvasImg" alt="মাঠের ছবি" />
    <div id="leafletMap"></div>
    <canvas id="overlayCanvas"></canvas>

    <!-- স্ক্রিনের মাঝখানের লাল ডট (টাচ করলে পয়েন্ট যুক্ত হবে) -->
    <div class="center-red-dot" id="centerRedDot" onclick="tapRedDot()" title="পয়েন্ট দিতে এখানে টাচ করুন">
        <div class="inner-dot"></div>
    </div>
    <div class="tap-hint-pill" id="tapHintPill">১ নম্বর পয়েন্ট দিতে লাল ডটে টাচ করুন</div>

    <!-- ডানদিকের ছোট কন্ট্রোল বাটন -->
    <div class="floating-actions">
        <button class="f-btn photo-btn" id="btnSnap" style="display:none;" onclick="capturePhoto()">📸 ছবি তুলুন</button>
        <label class="f-btn photo-btn" id="btnGallery" style="display:none; cursor:pointer;">
            📁 গ্যালারি <input type="file" accept="image/*" style="display:none;" onchange="loadPhoto(event)">
        </label>
        <button class="f-btn" onclick="undoPoint()">↩️ পেছনে</button>
        <button class="f-btn" onclick="resetAll()">🗑️ মুছুন</button>
    </div>
</div>

<!-- একদম নিচের সাদা পরিমাপ ও পদ্ধতি প্যানেল (২য় ছবির ডিজাইন অনুযায়ী) -->
<div class="bottom-sheet">
    <div class="sheet-header">
        <span class="sheet-title" id="sheetTitle">১) সোজা দাগ পরিমাপ</span>
        <span class="point-badge" id="pointCountBadge">পয়েন্ট: 0 / 2</span>
    </div>

    <!-- পরিমাপের কার্ডসমূহ -->
    <div class="cards-grid" id="cardsContainer"></div>

    <!-- একদম নিচে মাপার সহজ পদ্ধতি লেখা -->
    <div class="guide-footer" id="methodGuideText">
        মাঠের শুরুতে দাঁড়িয়ে স্ক্রিনের মাঝখানের <b>লাল ডটে</b> টাচ করলে ১ নম্বর পয়েন্ট হবে। এরপর ১০০, ২০০ বা ৪০০ মিটার দূরে গিয়ে আবার লাল ডটে টাচ করলে ২ নম্বর পয়েন্ট হবে এবং দূরত্ব দেখাবে।
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let mode = 'camera'; // 'camera', 'photo', 'map'
    let shape = 'line';  // 'line', 'triangle', 'quad', 'circle', 'polygon'
    let points = [];     // {lat, lng, screenX, screenY}
    let currentGPS = null;
    let gpsAccuracy = 999;
    let heading = 0;

    const videoEl = document.getElementById('cameraFeed');
    const photoImg = document.getElementById('photoCanvasImg');
    const overlay = document.getElementById('overlayCanvas');
    const ctx = overlay.getContext('2d');
    let stream = null;
    let map = null;
    let mapLayers = [];

    const maxPts = { line: 2, triangle: 3, quad: 4, circle: 2, polygon: 30 };

    const shapeInfo = {
        line: {
            title: '১) সোজা দাগ পরিমাপ',
            guide: 'মাঠের শুরুতে দাঁড়িয়ে স্ক্রিনের মাঝখানের <b>লাল ডটে</b> টাচ করলে ১ নম্বর পয়েন্ট হবে। এরপর ১০০, ২০০ বা ৪০০ মিটার দূরে গিয়ে আবার লাল ডটে টাচ করলে ২ নম্বর পয়েন্ট হবে এবং দূরত্ব দেখাবে।'
        },
        triangle: {
            title: '২) ত্রিভুজ পরিমাপ',
            guide: 'ত্রিভুজের প্রথম কোণায় দাঁড়িয়ে <b>লাল ডটে</b> টাচ করুন (১ নম্বর পয়েন্ট)। এরপর দ্বিতীয় কোণায় গিয়ে লাল ডটে টাচ করুন (২ নম্বর পয়েন্ট) এবং তৃতীয় কোণায় গিয়ে আবার লাল ডটে টাচ করুন (৩ নম্বর পয়েন্ট)।'
        },
        quad: {
            title: '৩) চতুর্ভুজ পরিমাপ',
            guide: 'মাঠের চারটি কোণায় পর্যায়ক্রমে গিয়ে স্ক্রিনের <b>লাল ডটে</b> ৪ বার টাচ করুন (১, ২, ৩ ও ৪ নম্বর পয়েন্ট)। চার বাহুর মাপের পাশাপাশি কোণা সোজা কি না তা দেখতে ২ কর্ণের মাপও দেখাবে।'
        },
        circle: {
            title: '৪) গোল / বৃত্ত পরিমাপ',
            guide: 'বৃত্তের ঠিক মাঝখানে (কেন্দ্রে) দাঁড়িয়ে <b>লাল ডটে</b> টাচ করলে ১ নম্বর পয়েন্ট হবে। এরপর যত মিটার দূরে দাগ দিতে চান সেখানে গিয়ে লাল ডটে টাচ করলে ২ নম্বর পয়েন্ট হবে এবং গোল বৃত্ত তৈরি হবে।'
        },
        polygon: {
            title: '৫) অন্যান্য আকৃতি পরিমাপ',
            guide: 'মাঠের যেকোনো আকৃতির সীমানা বরাবর ঘুরে প্রতিটি মোড়ে দাঁড়িয়ে স্ক্রিনের <b>লাল ডটে</b> টাচ করে পয়েন্ট দিন। মোট পরিসীমা ও ক্ষেত্রফল সাথে সাথে দেখাবে।'
        }
    };

    // ১. ক্যামেরা চালু
    async function startCamera() {
        try {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
                audio: false
            });
            videoEl.srcObject = stream;
        } catch (e) {
            alert('ক্যামেরা পারমিশন চালু করুন অথবা ওপর থেকে "মাঠের ছবি" বা "GPS ম্যাপ" বেছে নিন।');
        }
    }

    // ২. GPS ট্র্যাকিং
    function initGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(
            (pos) => {
                currentGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                gpsAccuracy = pos.coords.accuracy;
                const badge = document.getElementById('gpsBadge');
                badge.innerText = `📡 ±${gpsAccuracy.toFixed(1)} মি.`;
                badge.classList.toggle('good', gpsAccuracy <= 8);
                updateCards();
            },
            () => { document.getElementById('gpsBadge').innerText = '📡 GPS নেই'; },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
    }

    // ৩. কম্পাস ওরিয়েন্টেশন
    window.addEventListener('deviceorientationabsolute', onCompass, true);
    window.addEventListener('deviceorientation', onCompass, true);
    function onCompass(e) {
        if (e.webkitCompassHeading) heading = e.webkitCompassHeading;
        else if (e.alpha !== null) heading = 360 - e.alpha;
    }

    // ৪. মাঝখানের লাল ডটে টাচ করলে পয়েন্ট যুক্ত হবে
    function tapRedDot() {
        if (!currentGPS && mode !== 'map') {
            alert('ফোনের GPS লোকেশন এখনো পাওয়া যায়নি। খোলা আকাশের নিচে কয়েক সেকেন্ড অপেক্ষা করুন।');
            return;
        }
        if (points.length >= maxPts[shape]) {
            alert(`এই আকৃতির জন্য সর্বোচ্চ ${maxPts[shape]}টি পয়েন্ট দেওয়া হয়ে গেছে। নতুন করে মাপতে "মুছুন" বাটনে চাপুন।`);
            return;
        }

        const lat = currentGPS ? currentGPS.lat : 23.8103;
        const lng = currentGPS ? currentGPS.lng : 90.4125;

        points.push({
            lat: lat,
            lng: lng,
            screenX: overlay.width / 2,
            screenY: overlay.height / 2
        });

        updateHintPill();
        updateCards();
        if (mode === 'map') drawMapShapes();
    }

    function updateHintPill() {
        const pill = document.getElementById('tapHintPill');
        const nextNum = points.length + 1;
        if (points.length >= maxPts[shape]) {
            pill.innerText = '✅ সব পয়েন্ট দেওয়া সম্পন্ন হয়েছে';
        } else {
            pill.innerText = `${nextNum} নম্বর পয়েন্ট দিতে লাল ডটে টাচ করুন`;
        }
    }

    // মোড পরিবর্তন
    function switchMode(newMode) {
        mode = newMode;
        document.getElementById('tabCamera').classList.toggle('active', mode === 'camera');
        document.getElementById('tabPhoto').classList.toggle('active', mode === 'photo');
        document.getElementById('tabMap').classList.toggle('active', mode === 'map');

        videoEl.style.display = mode === 'camera' ? 'block' : 'none';
        photoImg.style.display = mode === 'photo' ? 'block' : 'none';
        document.getElementById('leafletMap').style.display = mode === 'map' ? 'block' : 'none';

        document.getElementById('btnSnap').style.display = mode === 'photo' ? 'flex' : 'none';
        document.getElementById('btnGallery').style.display = mode === 'photo' ? 'flex' : 'none';

        // ম্যাপ মোডে ম্যাপে সরাসরি টাচ করা যাবে, ক্যামেরা ও ছবি মোডে লাল ডট থাকবে
        document.getElementById('centerRedDot').style.display = mode === 'map' ? 'none' : 'flex';
        document.getElementById('tapHintPill').style.display = mode === 'map' ? 'none' : 'block';

        if (mode === 'camera') {
            startCamera();
        } else if (mode === 'photo' && !photoImg.src) {
            videoEl.style.display = 'block';
            photoImg.style.display = 'none';
            startCamera();
        } else if (mode === 'map') {
            initMap();
        }
    }

    // মাঠের ছবি তোলা ও গ্যালারি থেকে লোড করা
    function capturePhoto() {
        if (!videoEl.videoWidth) return;
        const c = document.createElement('canvas');
        c.width = videoEl.videoWidth; c.height = videoEl.videoHeight;
        c.getContext('2d').drawImage(videoEl, 0, 0);
        photoImg.src = c.toDataURL('image/jpeg', 0.92);
        videoEl.style.display = 'none';
        photoImg.style.display = 'block';
        if (stream) stream.getTracks().forEach(t => t.stop());
    }

    function loadPhoto(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
            photoImg.src = ev.target.result;
            videoEl.style.display = 'none';
            photoImg.style.display = 'block';
        };
        r.readAsDataURL(f);
    }

    // মাঠের ছবি মোডে পয়েন্টগুলো আঙুল দিয়ে টেনে সূক্ষ্মভাবে সরানোর সুবিধা
    let dragIdx = -1;
    overlay.addEventListener('pointerdown', (e) => {
        if (mode !== 'photo') return;
        const rect = overlay.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        for (let i = 0; i < points.length; i++) {
            if (Math.hypot(x - points[i].screenX, y - points[i].screenY) < 26) {
                dragIdx = i; return;
            }
        }
    });
    overlay.addEventListener('pointermove', (e) => {
        if (dragIdx === -1 || mode !== 'photo') return;
        const rect = overlay.getBoundingClientRect();
        points[dragIdx].screenX = e.clientX - rect.left;
        points[dragIdx].screenY = e.clientY - rect.top;
    });
    overlay.addEventListener('pointerup', () => { dragIdx = -1; });

    // GPS ম্যাপ মোড
    function initMap() {
        if (!map) {
            const lat = currentGPS ? currentGPS.lat : 23.8103;
            const lng = currentGPS ? currentGPS.lng : 90.4125;
            map = L.map('leafletMap').setView([lat, lng], 19);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 21
            }).addTo(map);

            map.on('click', (e) => {
                if (points.length < maxPts[shape]) {
                    points.push({ lat: e.latlng.lat, lng: e.latlng.lng });
                    drawMapShapes();
                    updateCards();
                }
            });
        }
        setTimeout(() => map.invalidateSize(), 200);
        drawMapShapes();
    }

    function drawMapShapes() {
        if (!map) return;
        mapLayers.forEach(l => map.removeLayer(l));
        mapLayers = [];

        points.forEach((p, idx) => {
            const m = L.circleMarker([p.lat, p.lng], {
                radius: 8, color: '#fff', fillColor: idx === 0 ? '#ef4444' : '#facc15', fillOpacity: 1
            }).addTo(map);
            mapLayers.push(m);
        });

        if (shape === 'circle' && points.length === 2) {
            const r = haversine(points[0], points[1]);
            mapLayers.push(L.circle([points[0].lat, points[0].lng], { radius: r, color: '#fff', fillOpacity: 0.18 }).addTo(map));
        } else if (points.length >= 2) {
            const coords = points.map(p => [p.lat, p.lng]);
            const poly = (points.length >= 3 && shape !== 'line')
                ? L.polygon(coords, { color: '#fff', fillOpacity: 0.18 }).addTo(map)
                : L.polyline(coords, { color: '#fff', weight: 3 }).addTo(map);
            mapLayers.push(poly);
        }
    }

    // আকৃতি পরিবর্তন
    function setShape(s) {
        shape = s;
        points = [];
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === s));
        document.getElementById('sheetTitle').innerText = shapeInfo[s].title;
        document.getElementById('methodGuideText').innerHTML = shapeInfo[s].guide;
        updateHintPill();
        updateCards();
        if (mode === 'map') drawMapShapes();
    }

    function undoPoint() {
        points.pop();
        updateHintPill();
        updateCards();
        if (mode === 'map') drawMapShapes();
    }

    function resetAll() {
        points = [];
        updateHintPill();
        updateCards();
        if (mode === 'map') drawMapShapes();
    }

    // দূরত্ব (Haversine সূত্র - মিটারে)
    function haversine(p1, p2) {
        const R = 6371000;
        const dLat = (p2.lat - p1.lat) * Math.PI / 180;
        const dLng = (p2.lng - p1.lng) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
                  Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getBearing(p1, p2) {
        const lat1 = p1.lat * Math.PI / 180, lat2 = p2.lat * Math.PI / 180;
        const dLng = (p2.lng - p1.lng) * Math.PI / 180;
        const y = Math.sin(dLng) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // নিচের ২ কলামের সাদা কার্ড আপডেট (২য় ছবির মতো)
    function updateCards() {
        const box = document.getElementById('cardsContainer');
        document.getElementById('pointCountBadge').innerText = `পয়েন্ট: ${points.length} / ${maxPts[shape]}`;
        box.innerHTML = '';

        const addCard = (label, value) => {
            box.innerHTML += `
                <div class="measure-card">
                    <span class="label">${label}</span>
                    <span class="value">${value}</span>
                </div>`;
        };

        // ১) সোজা দাগ
        if (shape === 'line') {
            let dist = 0;
            if (points.length === 2) dist = haversine(points[0], points[1]);
            else if (points.length === 1 && currentGPS) dist = haversine(points[0], currentGPS);

            addCard('মোট দূরত্ব (মিটার)', `${dist.toFixed(2)} মিটার`);
            addCard('দূরত্ব (ফুট)', `${(dist * 3.28084).toFixed(2)} ফুট`);
            addCard('দূরত্ব (গজ)', `${(dist * 1.09361).toFixed(2)} গজ`);
            addCard('মাঝখানের দাগ (Center)', `${(dist / 2).toFixed(2)} মিটার`);
        }
        // ২) ত্রিভুজ
        else if (shape === 'triangle') {
            if (points.length < 3) {
                const d1 = (points.length === 2) ? haversine(points[0], points[1]) : 0;
                addCard('১ম বাহুর দৈর্ঘ্য', `${d1.toFixed(2)} মিটার`);
                addCard('অবস্থা', `${points.length} / ৩টি পয়েন্ট দেওয়া হয়েছে`);
            } else {
                const a = haversine(points[1], points[2]);
                const b = haversine(points[0], points[2]);
                const c = haversine(points[0], points[1]);
                const perim = a + b + c;
                const s = perim / 2;
                const area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));

                addCard('১ম ও ২য় বাহু', `${c.toFixed(1)} মি. ও ${a.toFixed(1)} মি.`);
                addCard('৩য় বাহু', `${b.toFixed(2)} মিটার`);
                addCard('মোট পরিসীমা', `${perim.toFixed(2)} মিটার`);
                addCard('ক্ষেত্রফল', `${area.toFixed(1)} বর্গমিটার`);
            }
        }
        // ৩) চতুর্ভুজ
        else if (shape === 'quad') {
            if (points.length < 4) {
                addCard('পয়েন্ট সংখ্যা', `${points.length} / ৪টি পয়েন্ট`);
                addCard('নির্দেশনা', 'বাকি কোণায় গিয়ে লাল ডটে টাচ করুন');
            } else {
                const s1 = haversine(points[0], points[1]);
                const s2 = haversine(points[1], points[2]);
                const s3 = haversine(points[2], points[3]);
                const s4 = haversine(points[3], points[0]);
                const d1 = haversine(points[0], points[2]);
                const d2 = haversine(points[1], points[3]);

                addCard('দৈর্ঘ্য (১ম ও ৩য় বাহু)', `${s1.toFixed(1)} মি. ও ${s3.toFixed(1)} মি.`);
                addCard('প্রস্থ (২য় ও ৪র্থ বাহু)', `${s2.toFixed(1)} মি. ও ${s4.toFixed(1)} মি.`);
                addCard('১ম কর্ণ (Diagonal 1)', `${d1.toFixed(2)} মিটার`);
                addCard('২য় কর্ণ (Diagonal 2)', `${d2.toFixed(2)} মিটার`);
            }
        }
        // ৪) গোল / বৃত্ত (হুবহু ২য় ছবির ৪টি কার্ড)
        else if (shape === 'circle') {
            let r = 0;
            if (points.length === 2) r = haversine(points[0], points[1]);
            else if (points.length === 1 && currentGPS) r = haversine(points[0], currentGPS);

            addCard('ব্যাসার্ধ (Radius)', `${r.toFixed(2)} মিটার`);
            addCard('ব্যাস (Diameter)', `${(r * 2).toFixed(2)} মিটার`);
            addCard('পরিধি (চুন দেওয়ার দাগ)', `${(2 * Math.PI * r).toFixed(2)} মিটার`);
            addCard('ক্ষেত্রফল', `${(Math.PI * r * r).toFixed(1)} বর্গমিটার`);
        }
        // ৫) অন্যান্য / বহুভুজ
        else if (shape === 'polygon') {
            let perim = 0;
            for (let i = 0; i < points.length; i++) {
                if (i < points.length - 1 || points.length >= 3) {
                    perim += haversine(points[i], points[(i + 1) % points.length]);
                }
            }
            addCard('মোট পয়েন্ট', `${points.length}টি`);
            addCard('মোট পরিসীমা', `${perim.toFixed(2)} মিটার`);
        }
    }

    // ক্যামেরা AR ও মাঠের ছবি ক্যানভাস রেন্ডারিং (বৃত্তসহ)
    function renderLoop() {
        const vp = document.querySelector('.viewport');
        if (overlay.width !== vp.clientWidth || overlay.height !== vp.clientHeight) {
            overlay.width = vp.clientWidth;
            overlay.height = vp.clientHeight;
        }
        ctx.clearRect(0, 0, overlay.width, overlay.height);

        // ক্যামেরা AR মোড
        if (mode === 'camera' && currentGPS && points.length > 0) {
            const proj = points.map((pt, idx) => {
                const d = haversine(currentGPS, pt);
                const b = getBearing(currentGPS, pt);
                const rel = ((b - heading + 540) % 360) - 180;
                const sx = (overlay.width / 2) + (rel / 32.5) * (overlay.width / 2);
                const sy = (overlay.height * 0.50) + Math.min(200, (1200 / Math.max(2, d)));
                return { sx, sy, d, vis: Math.abs(rel) < 55, idx };
            });

            if (shape === 'circle' && proj.length === 2) {
                const rPx = Math.hypot(proj[1].sx - proj[0].sx, proj[1].sy - proj[0].sy);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
                ctx.beginPath(); ctx.arc(proj[0].sx, proj[0].sy, rPx, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            } else if (proj.length >= 2) {
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
                ctx.beginPath();
                proj.forEach((p, i) => i === 0 ? ctx.moveTo(p.sx, p.sy) : ctx.lineTo(p.sx, p.sy));
                if (proj.length >= 3 && shape !== 'line') ctx.closePath();
                ctx.stroke();
            }

            proj.forEach(p => {
                if (!p.vis) return;
                ctx.fillStyle = p.idx === 0 ? '#ef4444' : '#facc15';
                ctx.beginPath(); ctx.arc(p.sx, p.sy, 12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(p.idx + 1, p.sx, p.sy + 4);
            });
        }
        // মাঠের ছবি মোড
        else if (mode === 'photo' && points.length > 0) {
            if (shape === 'circle' && points.length === 2) {
                const rPx = Math.hypot(points[1].screenX - points[0].screenX, points[1].screenY - points[0].screenY);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5;
                ctx.fillStyle = 'rgba(250, 204, 21, 0.18)';
                ctx.beginPath(); ctx.arc(points[0].screenX, points[0].screenY, rPx, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(points[0].screenX, points[0].screenY); ctx.lineTo(points[1].screenX, points[1].screenY); ctx.stroke();
                ctx.restore();
            } else if (points.length >= 2) {
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5;
                ctx.beginPath();
                points.forEach((p, i) => i === 0 ? ctx.moveTo(p.screenX, p.screenY) : ctx.lineTo(p.screenX, p.screenY));
                if (points.length >= 3 && shape !== 'line') ctx.closePath();
                ctx.stroke();
            }

            points.forEach((p, i) => {
                ctx.fillStyle = i === 0 ? '#ef4444' : '#facc15';
                ctx.beginPath(); ctx.arc(p.screenX, p.screenY, 12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(i + 1, p.screenX, p.screenY + 4);
            });
        }

        requestAnimationFrame(renderLoop);
    }

    // শুরু করা
    initGPS();
    startCamera();
    updateCards();
    renderLoop();
</script>
</body>
</html>
