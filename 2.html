<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🚌 ভারতীয় লাইভ বাস ট্র্যাকার</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; text-transform: uppercase; }
    body {
      margin: 0;
      background: #eef2f5;
      padding: 0 10px 10px 10px;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      top: 0 !important;
    }
    input, select, textarea {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
      width: 100%;
      padding: 10px;
      margin: 5px 0 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    #google_translate_wrapper {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #fff;
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .goog-te-gadget { font-family: inherit !important; font-size: 0 !important; display: inline-flex !important; align-items: center !important; }
    .goog-te-gadget .goog-te-combo { font-family: inherit !important; font-size: 15px !important; padding: 6px 12px !important; border: 1px solid #aaa !important; border-radius: 8px !important; background: #fff !important; margin: 0 !important; }
    .goog-logo-link, .goog-te-gadget span { display: none !important; }

    .container { max-width: 1000px; margin: 12px auto; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2, h3 { text-align: center; color: #0d47a1; margin-top: 5px; }
    .btn { background: #1565c0; color: #fff; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin: 6px 0; }
    .btn-stop { background: #00796b; }
    .btn-cancel { background: #c62828; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hidden { display: none; }
    .box { background: #f1f8e9; border: 1px solid #c5e1a5; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    
    .time-picker-row { display: flex; gap: 6px; }
    .time-picker-row input { flex: 2; margin: 5px 0 10px; }
    .ampm-select {
      flex: 1;
      font-size: 18px !important;
      font-weight: 900 !important;
      color: #0d47a1;
      background: #e3f2fd !important;
      border: 2px solid #1565c0 !important;
      text-align: center;
      padding: 8px !important;
    }

    .bus-item { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 6px 0; background: #fafafa; cursor: pointer; transition: 0.2s; }
    .bus-item:hover { background: #e3f2fd; border-color: #1565c0; }
    #currentLocationBox { text-align: center; font-size: 17px; font-weight: bold; color: #2e7d32; background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 12px 0; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 6px; font-size: 13px; }
    .card b { color: #1565c0; }
    #map { height: 420px; border-radius: 8px; margin-top: 15px; border: 1px solid #ccc; }
    @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="google_translate_wrapper">
  <b>🌐 ভাষা:</b>
  <div id="google_translate_element"></div>
</div>

<div class="container">
  <h2>🚌 লাইভ বাস ট্র্যাকার (ভারত)</h2>

  <button id="toggleBusFormBtn" class="btn">➕ নতুন বাসের তথ্য যুক্ত করুন</button>

  <div id="busFormBox" class="box hidden">
    <h3>নতুন বাসের বিবরণ</h3>
    <div class="grid">
      <div><label>রাজ্য</label><input type="text" id="state" placeholder="STATE"></div>
      <div><label>জেলা</label><input type="text" id="district" placeholder="DISTRICT"></div>
      <div><label>বাস নম্বর</label><input type="text" id="busNoInput" placeholder="BUS NUMBER"></div>
      <div><label>বাসের নাম</label><input type="text" id="busNameInput" placeholder="BUS NAME"></div>
      <div>
        <label>বাস ক্যাটাগরি</label>
        <select id="category">
          <option value="PUBLIC">PUBLIC</option>
          <option value="NBSTC">NBSTC</option>
          <option value="SBSTC">SBSTC</option>
          <option value="CSTS">CSTS</option>
          <option value="OTHER GOVT. BUS">OTHER GOVT. BUS</option>
        </select>
      </div>
      <div><label>চলাচলের দিন</label><input type="text" id="days" placeholder="DAILY / MON-FRI"></div>
      <div><label>কোথা থেকে ছাড়বে?</label><input type="text" id="src" placeholder="FROM"></div>
      
      <div>
        <label>কখন ছাড়বে?</label>
        <div class="time-picker-row">
          <input type="text" id="srcTimeVal" placeholder="04:10">
          <select id="srcTimeAmpm" class="ampm-select">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>

      <div><label>কতদূর যাবে (গন্তব্য)?</label><input type="text" id="dest" placeholder="TO"></div>

      <div>
        <label>কখন পৌঁছাবে?</label>
        <div class="time-picker-row">
          <input type="text" id="destTimeVal" placeholder="06:00">
          <select id="destTimeAmpm" class="ampm-select">
            <option value="AM">AM</option>
            <option value="PM" selected>PM</option>
          </select>
        </div>
      </div>
    </div>
    <button class="btn" onclick="saveNewBus()">সংরক্ষণ করুন</button>
    <button class="btn btn-cancel" onclick="toggleBusForm(false)">বন্ধ করুন</button>
  </div>

  <button id="addStopBtn" class="btn btn-stop hidden" onclick="addCurrentStop()">📍 এই জায়গা ও এই সময় বাসের স্টপেজ হিসাবে যুক্ত করুন</button>

  <hr>

  <div class="grid">
    <div>
      <label>কোথা থেকে বাসে উঠবেন?</label>
      <input type="text" id="searchFrom" list="fromList" placeholder="শুরু করার স্থান লিখুন..." autocomplete="off">
      <datalist id="fromList"></datalist>
    </div>
    <div>
      <label>কোথায় যাবেন?</label>
      <input type="text" id="searchTo" list="toList" placeholder="গন্তব্য স্থান লিখুন..." autocomplete="off">
      <datalist id="toList"></datalist>
    </div>
  </div>

  <label>বাস নম্বর / নাম</label>
  <input type="text" id="busTrackInput" placeholder="বাস নম্বর বা নাম লিখুন">
  
  <div id="busList"></div>

  <div id="currentLocationBox">বাসের বর্তমান অবস্থান: কোনো বাস নির্বাচিত হয়নি</div>

  <div class="card-grid">
    <div class="card"><b>বর্তমান স্টপেজ:</b> <span id="infoCurStop">--</span></div>
    <div class="card"><b>পরবর্তী স্টপেজ:</b> <span id="infoNextStop">--</span></div>
    <div class="card"><b>দূরত্ব ও গতি:</b> <span id="infoDistSpeed">--</span></div>
    <div class="card"><b>সম্ভাব্য সময় (ETA):</b> <span id="infoEta">--</span></div>
    <div class="card"><b>ব্যবহারকারীর GPS:</b> <span id="infoUserGPS">--</span></div>
    <div class="card"><b>GPS কনফিডেন্স:</b> <span id="infoConfidence">--</span></div>
  </div>

  <div id="map"></div>
</div>

<script>
  // রাইট ক্লিক ও ইন্সপেক্ট বন্ধ
  document.addEventListener('contextmenu', e => e.preventDefault(), false);
  document.addEventListener('keydown', e => {
    if (e.key === "F12" || e.keyCode === 123) return e.preventDefault();
    if (e.ctrlKey && (e.key === "u" || e.key === "U" || e.keyCode === 85)) return e.preventDefault();
    if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.keyCode === 73 || e.keyCode === 74)) return e.preventDefault();
    if (e.ctrlKey && e.shiftKey && (e.key === "C" || e.key === "c" || e.keyCode === 67)) return e.preventDefault();
    if (e.ctrlKey && (e.key === "s" || e.key === "S" || e.keyCode === 83)) return e.preventDefault();
  }, false);
</script>

<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'bn', autoDisplay: false }, 'google_translate_element');
  }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyQefdRODbWqWTub3rkvqbeG1alnhBfeN2IFbHvj7lnJshcrs8Qwb38a-QZimeV4-_v8A/exec";

  let map = L.map('map').setView([22.5726, 88.3639], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  let busMarker = null, userMarker = null;
  let userPos = null, trackingBus = null, trackingInterval = null;
  let debounceTimer = null;

  const busIcon = L.divIcon({ html: '<div style="font-size:28px;">🚌</div>', className: '', iconSize: [30, 30] });
  const userIcon = L.divIcon({ html: '<div style="font-size:28px;">👤</div>', className: '', iconSize: [30, 30] });

  // সঠিক সময় দেখানোর ফাংশন (শিটের টেক্সটকে অবিকল রাখা)
  function formatCleanTime(timeStr) {
    if (!timeStr) return "";
    let str = String(timeStr).trim();
    
    // যদি শিট থেকে AM/PM সরাসরি টেক্সট হিসেবে আসে (যেমন 4:10 PM)
    if (/^\d{1,2}:\d{2}\s*(AM|PM)$/i.test(str)) {
      return str.toUpperCase();
    }
    
    // যদি শুধু 14:30 এমন 24-hr থাকে
    let simpleMatch = str.match(/^(\d{1,2}):(\d{2})$/);
    if (simpleMatch) {
      let h = parseInt(simpleMatch[1], 10);
      let m = simpleMatch[2];
      let ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    return str;
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      userPos = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy,
        speed: pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : 0
      };

      document.getElementById("infoUserGPS").innerText = `${userPos.lat.toFixed(4)}, ${userPos.lon.toFixed(4)} (±${Math.round(userPos.acc)}m)`;
      document.getElementById("infoConfidence").innerText = userPos.acc < 20 ? "HIGH (99%)" : userPos.acc < 50 ? "MEDIUM (85%)" : "LOW (50%)";

      if (!userMarker) userMarker = L.marker([userPos.lat, userPos.lon], { icon: userIcon }).addTo(map).bindPopup("আপনার অবস্থান");
      else userMarker.setLatLng([userPos.lat, userPos.lon]);

      if (trackingBus && busMarker) {
        let d = getDistanceMeters(userPos.lat, userPos.lon, busMarker.getLatLng().lat, busMarker.getLatLng().lng);
        if (d <= 50) {
          syncUserGPSAsBus(trackingBus.number, userPos.lat, userPos.lon, userPos.speed, userPos.acc);
        }
      }
    }, err => console.log(err), { enableHighAccuracy: true });
  }

  window.addEventListener("DOMContentLoaded", async () => {
    try {
      let res = await fetch(`${API_URL}?action=getBuses`);
      let data = await res.json();
      if (data.buses) {
        let fromSet = new Set(), toSet = new Set();
        data.buses.forEach(b => {
          if (b.source) fromSet.add(b.source.trim());
          if (b.dest) toSet.add(b.dest.trim());
        });
        fillDatalist("fromList", fromSet);
        fillDatalist("toList", toSet);
      }
    } catch (e) {}
  });

  function fillDatalist(elementId, items) {
    let dl = document.getElementById(elementId);
    dl.innerHTML = "";
    items.forEach(item => {
      let opt = document.createElement("option");
      opt.value = item;
      dl.appendChild(opt);
    });
  }

  const handleAutoSearch = () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(autoSearchBuses, 350);
  };

  document.getElementById("searchFrom").addEventListener("input", handleAutoSearch);
  document.getElementById("searchTo").addEventListener("input", handleAutoSearch);

  async function autoSearchBuses() {
    let from = document.getElementById("searchFrom").value.trim();
    let to = document.getElementById("searchTo").value.trim();

    if (!from && !to) {
      document.getElementById("busList").innerHTML = "";
      return;
    }

    let res = await fetch(`${API_URL}?action=getBuses&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    let data = await res.json();
    let listDiv = document.getElementById("busList");
    listDiv.innerHTML = "";

    if (!data.buses || data.buses.length === 0) {
      listDiv.innerHTML = `<div style="padding:8px;color:#c62828;">কোনো বাস পাওয়া যায়নি।</div>`;
      return;
    }

    data.buses.forEach(b => {
      let depTimeFormatted = formatCleanTime(b.depTime);
      let arrTimeFormatted = formatCleanTime(b.arrTime);

      let div = document.createElement("div");
      div.className = "bus-item";
      div.innerHTML = `<b>🚌 ${b.number} - ${b.name}</b> (${b.category})<br><small>রুট: ${b.source} [${depTimeFormatted}] ➔ ${b.dest} [${arrTimeFormatted}]</small>`;
      div.onclick = () => selectBus(b);
      listDiv.appendChild(div);
    });
  }

  function selectBus(b) {
    trackingBus = b;
    document.getElementById("busTrackInput").value = `${b.number} - ${b.name}`;
    document.getElementById("busList").innerHTML = "";

    let stopBtn = document.getElementById("addStopBtn");
    stopBtn.innerText = `📍 এই জায়গা ও এই সময় বাসের (${b.name} - ${b.number}) স্টপেজ হিসাবে যুক্ত করুন`;
    stopBtn.classList.remove("hidden");

    trackBus(b.number);
  }

  document.getElementById("busTrackInput").addEventListener("input", e => {
    let val = e.target.value.trim();
    if (val.length >= 3) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => trackBus(val), 500);
    }
  });

  function trackBus(busNo) {
    if (trackingInterval) clearInterval(trackingInterval);
    fetchBusLive(busNo);
    trackingInterval = setInterval(() => fetchBusLive(busNo), 10000);
  }

  async function fetchBusLive(busNo) {
    let res = await fetch(`${API_URL}?action=getLive&busNo=${encodeURIComponent(busNo)}`);
    let data = await res.json();
    let locBox = document.getElementById("currentLocationBox");

    if (!data.ok || !data.live) {
      locBox.innerText = `বাসের অবস্থান এখনও পাওয়া যায়নি (${busNo})`;
      return;
    }

    let b = data.live;
    let lat = Number(b.lat), lon = Number(b.lon);

    locBox.innerText = `বাসের বর্তমান অবস্থান: LAT ${lat.toFixed(4)}, LON ${lon.toFixed(4)} (গতি: ${b.speed || 0} KM/H)`;
    locBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

    if (!busMarker) busMarker = L.marker([lat, lon], { icon: busIcon }).addTo(map);
    else busMarker.setLatLng([lat, lon]);

    map.setView([lat, lon], 14);

    if (userPos) {
      let d = (getDistanceMeters(userPos.lat, userPos.lon, lat, lon) / 1000).toFixed(2);
      busMarker.bindPopup(`বাস: ${b.busNumber}<br>দূরত্ব: ${d} KM`).openPopup();
      document.getElementById("infoDistSpeed").innerText = `${d} KM | গতি: ${b.speed || 0} KM/H`;
    }

    if (data.stops && data.stops.length > 0) {
      document.getElementById("infoCurStop").innerText = data.stops[0].name;
      if (data.stops[1]) {
        document.getElementById("infoNextStop").innerText = data.stops[1].name;
        document.getElementById("infoEta").innerText = formatCleanTime(data.stops[1].time) || "শীঘ্রই";
      }
    }
  }

  document.getElementById("toggleBusFormBtn").onclick = () => toggleBusForm(true);
  function toggleBusForm(show) {
    document.getElementById("busFormBox").classList.toggle("hidden", !show);
    document.getElementById("toggleBusFormBtn").classList.toggle("hidden", show);
  }

  async function saveNewBus() {
    let srcTime = `${document.getElementById("srcTimeVal").value.trim()} ${document.getElementById("srcTimeAmpm").value}`;
    let destTime = `${document.getElementById("destTimeVal").value.trim()} ${document.getElementById("destTimeAmpm").value}`;

    let payload = {
      action: "addBus",
      state: document.getElementById("state").value,
      district: document.getElementById("district").value,
      busNumber: document.getElementById("busNoInput").value,
      busName: document.getElementById("busNameInput").value,
      category: document.getElementById("category").value,
      days: document.getElementById("days").value,
      source: document.getElementById("src").value,
      depTime: srcTime,
      dest: document.getElementById("dest").value,
      arrTime: destTime
    };

    if (!payload.busNumber || !payload.source) return alert("প্রয়োজনীয় তথ্য পূরণ করুন!");

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      alert("বাস তথ্য সফলভাবে সংরক্ষণ হয়েছে!");
      toggleBusForm(false);
      location.reload();
    } catch (e) {
      alert("সংরক্ষণ ব্যর্থ হয়েছে!");
    }
  }

  async function addCurrentStop() {
    if (!userPos || !trackingBus) return alert("জিপিএস ও বাস নির্বাচন আবশ্যক!");
    let stopName = prompt("বাস স্টপের নাম লিখুন:");
    if (!stopName) return;

    let now = new Date();
    let hours = now.getHours();
    let minutes = String(now.getMinutes()).padStart(2, '0');
    let ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    let timeStr = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;

    let payload = {
      action: "addStop",
      busNumber: trackingBus.number,
      busName: trackingBus.name,
      stopName: stopName,
      time: timeStr,
      lat: userPos.lat,
      lon: userPos.lon,
      accuracy: userPos.acc
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      alert("স্টপ সফলভাবে যুক্ত হয়েছে!");
    } catch (e) {
      alert("স্টপ যুক্ত করা সম্ভব হয়নি!");
    }
  }

  async function syncUserGPSAsBus(busNo, lat, lon, speed, acc) {
    let payload = { action: "updateGPS", busNumber: busNo, lat: lat, lon: lon, speed: speed, accuracy: acc };
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    let R = 6371e3, p = Math.PI / 180;
    let a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 + Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lon2 - lon1) * p)) / 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
</script>
</body>
</html>
