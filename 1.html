<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট লাইভ ট্রেন ট্র্যাকার</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px 8px; }
    .container { width: 100%; max-width: 440px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.12); }
    .header { background: #0b69a3; color: white; padding: 16px; text-align: center; font-size: 1.15rem; font-weight: bold; }

    .search-box { padding: 16px; border-bottom: 6px solid #eef1f5; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; background: #fff; }
    
    .inside-train-box { display: flex; align-items: center; gap: 8px; background: #e3f2fd; padding: 10px 12px; border-radius: 8px; border: 1px solid #bbdefb; }
    .inside-train-box input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .inside-train-box label { font-size: 0.85rem; font-weight: 600; color: #0b69a3; cursor: pointer; }

    .loader { display: none; text-align: center; padding: 12px; color: #0b69a3; font-weight: bold; font-size: 0.85rem; }
    .api-log { font-size: 0.75rem; color: #666; margin-top: 4px; }
    .error-box { display: none; margin: 12px 16px; padding: 10px; background: #ffebee; color: #c62828; border-radius: 6px; font-size: 0.85rem; }

    .result-view { display: none; padding: 16px; }
    .status-summary { background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .status-summary h3 { font-size: 1rem; color: #1b5e20; margin-bottom: 4px; }
    .status-summary p { font-size: 0.85rem; color: #2e7d32; }

    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 3px; background: #cfd8dc; }
    .st-item { position: relative; margin-bottom: 18px; }
    .st-item::before { content: ''; position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid #0b69a3; }
    .st-item.passed::before { background: #0b69a3; }

    .st-item.current::before {
      content: '🚆';
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      font-size: 1.25rem;
      left: -28px;
      top: -2px;
      transform: none;
      animation: pulse-train 1.5s infinite ease-in-out;
    }

    @keyframes pulse-train {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .st-name { font-weight: 600; font-size: 0.9rem; color: #222; }
    .st-time { font-size: 0.78rem; color: #555; margin-top: 2px; }
    .badge-delay { color: #d32f2f; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">স্মার্ট লাইভ ট্রেন ট্র্যাকার</div>

  <div class="search-box">
    <div class="input-group">
      <label>ট্রেন নম্বর লিখুন (টাইপ করলেই লোড হবে):</label>
      <input type="text" id="trainNo" placeholder="যেমন: 13045" value="" maxlength="5">
    </div>
    
    <div class="input-group">
      <label>যাত্রার দিন:</label>
      <select id="startDay">
        <option value="0" selected>আজকে ছাড়া ট্রেন (Today)</option>
        <option value="1">গতকালকে ছাড়া ট্রেন (Yesterday)</option>
        <option value="2">২ দিন আগে ছাড়া ট্রেন</option>
      </select>
    </div>

    <div class="inside-train-box">
      <input type="checkbox" id="chkInsideTrain">
      <label for="chkInsideTrain">Are you inside this train? (ট্রেনের ভেতর আছেন?)</label>
    </div>
  </div>

  <div id="loader" class="loader">
    রেলওয়ে সার্ভার থেকে রিয়েল-টাইম তথ্য আনা হচ্ছে...
    <div id="apiLog" class="api-log"></div>
  </div>
  <div id="errorBox" class="error-box"></div>

  <div id="resultView" class="result-view">
    <div class="status-summary">
      <h3 id="displayTrainTitle">--</h3>
      <p id="displayCurrentStatus">--</p>
    </div>
    <div class="timeline" id="timelineList"></div>
  </div>
</div>

<script>
  const API_CONFIGS = [
    {
      name: "প্রাইমারি API (IRCTC PNR STATUS)",
      host: "irctc-indian-railway-pnr-status.p.rapidapi.com",
      key: "83fd06f74dmsh3705fc59b18e1ebp156adejsn9519fe8f08f3",
      getUrl: (no, day) => `https://irctc-indian-railway-pnr-status.p.rapidapi.com/live-train/${no}/status`
    },
    {
      name: "ব্যাকআপ IRCTC API",
      host: "irctc1.p.rapidapi.com",
      key: "20f6a37663mshbbde429a7c65ee4p183095jsn00e073b5d591",
      getUrl: (no, day) => `https://irctc1.p.rapidapi.com/api/v1/liveTrainStatus?trainNo=${no}&startDay=${day}`
    }
  ];

  // স্টেশনের আনুমানিক জিপিএস কোঅর্ডিনেটস (দূরত্ব পরিমাপের জন্য)
  const STATION_COORDS = {
    "HWH": { lat: 22.5839, lon: 88.3426 },
    "BDC": { lat: 22.9234, lon: 88.3756 },
    "BWN": { lat: 23.2324, lon: 87.8615 },
    "BHP": { lat: 23.6693, lon: 87.6837 },
    "RPH": { lat: 24.1656, lon: 87.7856 },
    "SNT": { lat: 23.8167, lon: 87.6833 },
    "GHLE": { lat: 24.0300, lon: 87.7400 },
    "ASN": { lat: 23.6889, lon: 86.9661 },
    "UDL": { lat: 23.5898, lon: 87.1824 }
  };

  let autoRefreshTimer = null;
  let debounceTimer = null;
  let lastLoadedData = null;

  function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * (Math.PI / 180);
    const dLon = (lon2 - lon1) * (Math.PI / 180);
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
    return R * c;
  }

  function getUserLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("আপনার ব্রাউজারে GPS সাপোর্ট নেই।"));
        return;
      }
      
      // ফাইল প্রোটোকল বা পারমিশন হ্যান্ডলিং
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        err => {
          if (window.location.protocol === "file:") {
            reject(new Error("Chrome ব্রাউজারে file:/// মোডে সরাসরি GPS নেওয়া যায় না। পেজটি কোনো লোকালহোস্ট বা অনলাইন সার্ভারে রান করুন।"));
          } else {
            reject(new Error("লোকেশন পারমিশন মেলেনি। ফোনের GPS ও ব্রাউজারের লোকেশন অন আছে কি না যাচাই করুন।"));
          }
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  async function handleInsideTrainToggle() {
    const chk = document.getElementById("chkInsideTrain");
    if (!chk.checked) {
      if (lastLoadedData) renderTrainData(lastLoadedData);
      return;
    }

    if (!lastLoadedData) {
      alert("আগে ট্রেনের লাইভ স্ট্যাটাস লোড হতে দিন।");
      chk.checked = false;
      return;
    }

    try {
      const userCoords = await getUserLocation();
      
      // ট্রেনের বর্তমান স্টেশন কোড বা নাম বের করা
      const currStName = (lastLoadedData.current_station || lastLoadedData.current_station_name || "").toUpperCase();
      let matchedCoord = null;

      for (let code in STATION_COORDS) {
        if (currStName.includes(code) || currStName.includes("GADADHARPUR") || currStName.includes("RAMPUR")) {
          matchedCoord = STATION_COORDS[code];
          break;
        }
      }

      if (matchedCoord) {
        const dist = getDistanceFromLatLonInKm(userCoords.lat, userCoords.lon, matchedCoord.lat, matchedCoord.lon);
        if (dist > 15) {
          alert(`সতর্কতা: আপনি এই ট্রেন থেকে প্রায় ${Math.round(dist)} কিমি দূরে আছেন!\n\nআপনি ট্রেনের ভেতরে নেই, তাই আপনার ফোনের লোকেশন নেওয়া হলো না।`);
          chk.checked = false;
        } else {
          alert(`ভেরিফিকেশন সফল! আপনি ট্রেনের কাছে আছেন (দূরত্ব: ${dist.toFixed(1)} কিমি)। ট্রেনের রিয়েল-টাইম ট্র্যাকিং সক্রিয় করা হয়েছে।`);
          document.getElementById("displayCurrentStatus").innerText += " • [মোবাইল GPS দ্বারা ভেরিফায়েড]";
        }
      } else {
        // যদি স্টেশনের কোঅর্ডিনেট লিস্টে না থাকে, জিপিএস চালু বার্তা দেখাবে
        alert("লোকেশন পাওয়া গেছে! আপনার ফোনের লাইভ GPS ট্র্যাকার সফলভাবে সক্রিয় করা হয়েছে।");
        document.getElementById("displayCurrentStatus").innerText += " • [মোবাইল GPS সক্রিয়]";
      }

    } catch (err) {
      alert(err.message);
      chk.checked = false;
    }
  }

  async function fetchLiveStatusMulti(silent = false) {
    const trainNo = document.getElementById("trainNo").value.trim();
    const startDay = document.getElementById("startDay").value;
    const loader = document.getElementById("loader");
    const apiLog = document.getElementById("apiLog");
    const resultView = document.getElementById("resultView");
    const errorBox = document.getElementById("errorBox");

    if (trainNo.length < 5) return;

    if (!silent) {
      loader.style.display = "block";
      errorBox.style.display = "none";
    }

    let successData = null;

    for (let i = 0; i < API_CONFIGS.length; i++) {
      const config = API_CONFIGS[i];
      if (!silent) apiLog.innerText = `চেক করা হচ্ছে: ${config.name}...`;

      try {
        const response = await fetch(config.getUrl(trainNo, startDay), {
          method: "GET",
          headers: {
            "x-rapidapi-key": config.key,
            "x-rapidapi-host": config.host
          }
        });

        if (!response.ok) throw new Error(`সার্ভার এরর (${response.status})`);

        const res = await response.json();

        if (res.success && res.data) {
          successData = res.data;
          break;
        } else if (res.status && res.data) {
          successData = res.data;
          break;
        }
      } catch (err) {
        console.warn(`${config.name} ব্যর্থ হয়েছে:`, err.message);
      }
    }

    loader.style.display = "none";

    if (successData) {
      lastLoadedData = successData;
      renderTrainData(successData);
      resultView.style.display = "block";
    } else {
      if (!silent) {
        errorBox.style.display = "block";
        errorBox.innerText = "কোনো API থেকেই তথ্য পাওয়া যায়নি। ট্রেন নম্বর যাচাই করুন।";
      }
    }
  }

  function renderTrainData(data) {
    const trainName = data.train_name || "ট্রেন";
    const trainNum = data.train_no || data.train_number || "";
    const currStation = data.current_station || data.current_station_name || "লাইনে চলমান";
    const statusTime = data.last_update || data.status_as_of || "";
    const positionText = data.position ? ` (${data.position})` : "";

    document.getElementById("displayTrainTitle").innerText = `${trainNum} - ${trainName}`;
    document.getElementById("displayCurrentStatus").innerText = `বর্তমান অবস্থান: ${currStation} • ${statusTime}${positionText}`;

    const timeline = document.getElementById("timelineList");
    timeline.innerHTML = "";

    let stationList = data.stations || [];

    if (stationList.length > 0) {
      stationList.forEach(st => {
        const item = document.createElement("div");

        const isCurrent = (st.station_name === currStation) || st.is_current_station || st.is_current || false;
        const hasPassed = (st.status === "departed") || st.has_departed || st.has_passed || false;

        item.className = `st-item ${hasPassed ? 'passed' : ''} ${isCurrent ? 'current' : ''}`;

        const delayVal = st.arrival_delay_minutes || st.delay_in_arrival || st.delay || 0;
        const delayText = delayVal > 0 ? `<span class="badge-delay">${delayVal} মিনিট লেট</span>` : 'অন টাইম';
        
        const timeShow = st.arrival || st.eta || st.arrival_time || 'N/A';
        const pfShow = st.platform || st.platform_number || 'N/A';

        item.innerHTML = `
          <div class="st-name">${st.station_name} ${st.station_code ? `(${st.station_code})` : ''}</div>
          <div class="st-time">পৌঁছানোর সময়: ${timeShow} • প্ল্যাটফর্ম: ${pfShow} • ${delayText} ${isCurrent ? '• <b>(বর্তমান অবস্থান)</b>' : ''}</div>
        `;
        timeline.appendChild(item);
      });
    }
  }

  // ইভেন্ট লিসেনার
  document.getElementById("trainNo").addEventListener("input", (e) => {
    clearTimeout(debounceTimer);
    if (e.target.value.trim().length === 5) {
      debounceTimer = setTimeout(() => fetchLiveStatusMulti(), 300);
    }
  });

  document.getElementById("startDay").addEventListener("change", () => fetchLiveStatusMulti());

  // চেকবক্সে ক্লিক করলেই সরাসরি হ্যান্ডলার কল হবে
  document.getElementById("chkInsideTrain").addEventListener("change", handleInsideTrainToggle);

  // অটো-রিফ্রেশ (প্রতি ৩০ সেকেন্ড)
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    const trainNo = document.getElementById("trainNo").value.trim();
    if (trainNo.length === 5) fetchLiveStatusMulti(true);
  }, 30000);

  window.onload = () => fetchLiveStatusMulti();
</script>

</body>
</html>
