<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্মার্ট লাইভ ট্রেন ট্র্যাকার</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{margin:0;background:#f4f7fb;color:#172033}header{background:#075985;color:#fff;padding:12px;text-align:center;font-size:20px;font-weight:700}main{max-width:900px;margin:auto;padding:10px}.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0001}input,button{width:100%;padding:11px;margin:4px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}button{background:#075985;color:#fff;border:0;font-weight:700;cursor:pointer}.stop{background:#b91c1c}.gps{background:#15803d}.msg{padding:10px;border-radius:8px;margin:6px 0}.info{background:#e0f2fe;color:#075985}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.result{background:#fff;padding:10px;border-radius:10px;margin-top:8px}.hide{display:none!important}#map{height:430px;border-radius:10px;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.small{font-size:13px;color:#475569}.gpsgate{text-align:center;border:2px solid #dc2626;background:#fff1f2;padding:12px;border-radius:10px;margin-bottom:10px}.gpsgate button{background:#dc2626}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}
</style></head><body>
<header>🚆 স্মার্ট লাইভ ট্রেন ট্র্যাকার</header><main>

<div id="gpsGate" class="gpsgate">
<b>📍 Device GPS/Location প্রয়োজন</b>
<div id="gpsGateText" style="margin:7px 0">ট্রেন ট্র্যাকিং শুরু করার আগে Device GPS/Location সক্রিয় করুন।</div>
<button id="activateGPS">📍 Activate Device GPS/Location</button>
</div>

<div class="box">
<input id="trainNo" type="tel" inputmode="numeric" maxlength="5" placeholder="৫ সংখ্যার Train Number দিন">
<div class="check"><input id="insideTrain" type="checkbox"><label for="insideTrain">আপনি কি ট্রেনের ভেতরে আছেন?</label></div>
<div class="row"><button id="startBtn">▶️ Start Tracking</button><button id="stopBtn" class="stop">⏹️ Stop</button></div>
<div id="status" class="msg info hide"></div>
</div>

<div class="box"><div id="trainInfo">🚆 Train তথ্য এখানে দেখাবে</div><div id="userInfo">📍 আপনার GPS তথ্য এখানে দেখাবে</div><div id="result" class="result hide"></div><div id="map"></div></div>

<div class="box small">⚠️ Live location তথ্য API/GPS-এর উপর নির্ভরশীল। GPS accuracy কম হলে অবস্থান ভুল হতে পারে।</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbxpHggaA7sNDXrwcyNid4Yy-Mfm3nLe8M0VGgplD4XHHc7Ul9LTWDJtpjj4C_4MFGopBQ/exec",API_MS=420000,GPS_MS=15000,MAX_ACC=200,VERIFY=1.5,MAX_API=1200000;
let map=L.map("map").setView([22.57,88.36],7),train=null,raw=null,samples=[],running=false,inside=false,watchId=null,timer=null,stopTimer=null,trainMarker=null,userMarker=null,line=null,distanceMarker=null,lastPublish=0,gpsReady=false,startToken=0;
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])),msg=(t,c="info")=>{$("status").className="msg "+c;$("status").innerHTML=t;$("status").classList.remove("hide")},res=(t,c="info")=>{$("result").className="result "+c;$("result").innerHTML=t;$("result").classList.remove("hide")};
function gpsMessage(t,c="info"){msg(t,c);$("gpsGateText").innerHTML=t}
function checkSecure(){if(!window.isSecureContext){gpsMessage("❌ GPS চালাতে HTTPS প্রয়োজন।","bad");$("gpsGate").classList.remove("hide");return false}if(!navigator.geolocation){gpsMessage("❌ এই Browser-এ Location/GPS নেই।","bad");return false}return true}
function saveGPS(p){let c=p.coords,s={lat:Number(c.latitude),lon:Number(c.longitude),accuracy:Number(c.accuracy)||999,speed:c.speed,heading:c.heading,time:p.timestamp||Date.now()};if(!Number.isFinite(s.lat)||!Number.isFinite(s.lon))throw Error("GPS coordinate পাওয়া যায়নি");gpsReady=true;$("gpsGate").classList.add("hide");$("userInfo").innerHTML=`📍 <b>আপনার GPS:</b> ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)} | Accuracy ±${Math.round(s.accuracy)}m`;if(s.accuracy<=MAX_ACC){samples.push(s);if(samples.length>20)samples.shift();drawUser(s);verify()}return s}
function gpsErr(e){if(e.code===1){gpsReady=false;$("gpsGate").classList.remove("hide");gpsMessage("❌ Location Permission দেওয়া হয়নি। Browser-এ Allow করুন।","bad")}else if(e.code===2){gpsMessage("⚠️ Device Location ON আছে, কিন্তু GPS coordinate পাওয়া যাচ্ছে না। Location ON রেখে কিছুক্ষণ অপেক্ষা করুন।","bad")}else if(e.code===3){gpsMessage("⚠️ GPS response পেতে সময় লাগছে। Location ON রেখে আবার চেষ্টা করুন।","bad")}else gpsMessage("⚠️ GPS পাওয়া যাচ্ছে না।","bad")}
function getGPS(){return new Promise((resolve,reject)=>{if(!checkSecure())return reject(Error("GPS/Location required"));navigator.geolocation.getCurrentPosition(p=>{try{resolve(saveGPS(p))}catch(e){reject(e)}},e=>{gpsErr(e);reject(e)},{enableHighAccuracy:true,maximumAge:0,timeout:30000})})}
function startGPS(){if(!checkSecure())return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{try{saveGPS(p)}catch(e){}},e=>{if(e.code===1){gpsErr(e);if(running)stop(false)}else gpsErr(e)},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
function hav(a,b){let R=6371,d=Math.PI/180,x=(b.lat-a.lat)*d,y=(b.lon-a.lon)*d,q=Math.sin(x/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function get(o){return fetch(API+"?"+new URLSearchParams(o),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("API error");return r.json()})}
function locate(j){let x=j?.train||j?.data||j?.location||j;if(Array.isArray(x))x=x[0];let lat=Number(x?.lat??x?.latitude),lon=Number(x?.lon??x?.lng??x?.longitude);return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon,name:x?.name||x?.station||"",speed:Number(x?.speed)||0,heading:Number(x?.heading),time:x?.time||x?.timestamp||Date.now()}:null}
function drawTrain(){if(!train)return;if(trainMarker)trainMarker.setLatLng([train.lat,train.lon]);else trainMarker=L.marker([train.lat,train.lon]).addTo(map).bindPopup("🚆 Train Location");$("trainInfo").innerHTML=`🚆 <b>Train:</b> ${esc($("trainNo").value)} | 📍 ${train.lat.toFixed(5)}, ${train.lon.toFixed(5)} | Speed: ${train.speed||0} km/h`;if(!userMarker)map.setView([train.lat,train.lon],10)}
function drawUser(s){if(!userMarker)userMarker=L.circleMarker([s.lat,s.lon],{radius:8}).addTo(map).bindPopup("📍 আপনার GPS");else userMarker.setLatLng([s.lat,s.lon]);if(train){if(line)line.setLatLngs([[train.lat,train.lon],[s.lat,s.lon]]);else line=L.polyline([[train.lat,train.lon],[s.lat,s.lon]],{dashArray:"7,7"}).addTo(map);let d=hav(train,s);if(distanceMarker)distanceMarker.setLatLng([s.lat,s.lon]).setTooltipContent("Distance: "+d.toFixed(2)+" km");else distanceMarker=L.marker([s.lat,s.lon],{opacity:0}).addTo(map).bindTooltip("Distance: "+d.toFixed(2)+" km",{permanent:true}).openTooltip()}}
function verify(){if(!train||!samples.length)return;let s=samples[samples.length-1],d=hav(train,s),acc=s.accuracy||999,score=0;score+=Math.max(0,1-d/VERIFY)*40;score+=Math.max(0,1-acc/MAX_ACC)*15;if(s.speed!=null&&train.speed){score+=Math.max(0,1-Math.abs(s.speed-train.speed)/100)*20}if(samples.length>=2)score+=15;if(samples.length>=5)score+=10;score=Math.round(Math.min(100,score));let ok=d<=VERIFY&&score>=70;res(`📏 Train-GPS distance: <b>${d.toFixed(2)} km</b><br>🎯 Confidence: <b>${score}%</b><br>${ok?"✅ GPS ও Train movement যথেষ্ট মিলছে।":"⚠️ GPS ও Train location-এর মিল কম।"}<br>📡 GPS Samples: ${samples.length}`,ok?"ok":"info")}
async function update(){if(!gpsReady)throw Error("📍 Device GPS/Location ছাড়া ট্র্যাকিং করা যাবে না।");let j=await get({action:"live",trainNo:$("trainNo").value.trim()}),old=train;raw=j;train=locate(j);if(!train)throw Error("Train live location পাওয়া যায়নি");drawTrain();if(old&&raw?.source==="gps")msg("📡 অন্য ব্যবহারকারীর GPS থেকে Train location দেখানো হচ্ছে।","ok");verify()}
function schedule(){clearTimeout(timer);if(!running)return;timer=setTimeout(async()=>{try{await update()}catch(e){msg("⚠️ "+esc(e.message),"bad")}if(running)schedule()},GPS_MS)}
async function start(){let n=$("trainNo").value.trim();if(!/^\d{5}$/.test(n))return msg("❌ ৫ সংখ্যার Train Number দিন।","bad");const token=++startToken;stop(false);samples=[];train=null;raw=null;$("result").classList.add("hide");$("trainInfo").innerHTML="⏳ Train live তথ্য খোঁজা হচ্ছে...";$("userInfo").innerHTML="📍 GPS coordinate নেওয়া হচ্ছে...";try{await getGPS()}catch(e){running=false;return}if(token!==startToken)return;running=true;inside=$("insideTrain").checked;startGPS();try{await update()}catch(e){msg("❌ "+esc(e.message),"bad")}if(token!==startToken||!running)return;schedule();stopTimer=setTimeout(()=>{if(running&&!inside){stop(false);msg("⏹️ API tracking 20 মিনিট পরে বন্ধ হয়েছে।","info")}},MAX_API)}
function stop(show=true){running=false;clearTimeout(timer);clearTimeout(stopTimer);timer=stopTimer=null;if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(show)msg("⏹️ Tracking বন্ধ হয়েছে।","info")}
$("activateGPS").onclick=async()=>{let b=$("activateGPS");b.disabled=true;b.innerText="📍 GPS যাচাই হচ্ছে...";try{await getGPS();if($("trainNo").value.trim().length===5)start()}catch(e){}finally{b.disabled=false;b.innerText="📍 Activate Device GPS/Location"}};
$("startBtn").onclick=start;$("stopBtn").onclick=()=>stop(true);$("insideTrain").onchange=e=>{inside=e.target.checked};
$("trainNo").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,5)};
document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("keydown",e=>{if((e.ctrlKey&&(e.key==="u"||e.key==="U"||e.key==="s"||e.key==="S"))||e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key)))e.preventDefault()});
window.addEventListener("load",()=>{if(!window.isSecureContext)gpsMessage("❌ এই পেজটি HTTPS-এ চালাতে হবে।","bad");else{$("gpsGate").classList.remove("hide");gpsMessage("📍 Tracking শুরু করতে প্রথমে Device GPS/Location যাচাই করুন।","info")}});
</script></body></html>
