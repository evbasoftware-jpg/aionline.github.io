<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Honor of Kings - Mini Arena</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 8px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 320px;
            background: #1e293b;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 8px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }
        #game-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        #game-modal h2 {
            font-size: 24px;
            color: #f59e0b;
            margin-bottom: 8px;
        }
        #game-modal p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            padding: 0 8px;
        }
        .touch-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .atk-btn {
            background: #b91c1c;
            border-color: #ef4444;
        }
        .skill-btn {
            background: #4338ca;
            border-color: #6366f1;
        }
        .touch-btn:active {
            filter: brightness(1.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Honor of Kings: Mini MOBA</h1>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="320"></canvas>
        <div id="ui-overlay">
            <span id="player-hp">হিরো HP: 100</span>
            <span id="enemy-tower-hp">শত্রুর টাওয়ার: 300</span>
        </div>
        <div id="game-modal">
            <h2 id="modal-title">যুদ্ধক্ষেত্র শুরু!</h2>
            <p id="modal-desc">শত্রু হিরো এবং মিনিয়নদের পরাস্ত করে প্রতিপক্ষের মূল টাওয়ার ধ্বংস করুন!<br>PC: <b>A/D</b> বা তীরচিহ্ন দিয়ে ডানে-বাঁয়ে যান, <b>J</b> দিয়ে আক্রমণ এবং <b>K</b> দিয়ে বিশেষ ক্ষমতা ব্যবহার করুন।</p>
            <button class="btn" id="start-btn">লড়াই শুরু করুন</button>
        </div>
    </div>

    <div class="controls">
        <button class="touch-btn" id="btn-left">◀ বাঁয়ে</button>
        <button class="touch-btn" id="btn-right">ডানে ▶</button>
        <button class="touch-btn atk-btn" id="btn-atk">⚔️ অ্যাটাক</button>
        <button class="touch-btn skill-btn" id="btn-skill">⚡ স্কিল</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const playerHpText = document.getElementById('player-hp');
        const enemyTowerHpText = document.getElementById('enemy-tower-hp');
        const modal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const startBtn = document.getElementById('start-btn');

        let isRunning = false;
        let frameCount = 0;

        // টাওয়ার
        const allyTower = { x: 20, y: 150, w: 40, h: 110, hp: 300, maxHp: 300 };
        const enemyTower = { x: 540, y: 150, w: 40, h: 110, hp: 300, maxHp: 300 };

        // প্লেয়ার হিরো
        const hero = {
            x: 80,
            y: 220,
            w: 24,
            h: 40,
            speed: 3.5,
            hp: 120,
            maxHp: 120,
            atkRange: 45,
            atkPower: 12,
            skillCooldown: 0,
            movingLeft: false,
            movingRight: false
        };

        // শত্রু হিরো
        const enemyHero = {
            x: 480,
            y: 220,
            w: 24,
            h: 40,
            speed: 2,
            hp: 120,
            maxHp: 120,
            atkRange: 40,
            atkPower: 8,
            atkCooldown: 0,
            isDead: false,
            respawnTimer: 0
        };

        let friendlyMinions = [];
        let enemyMinions = [];
        let effects = [];

        function spawnMinion(team) {
            if (team === 'ally') {
                friendlyMinions.push({ x: 65, y: 235, w: 16, h: 25, hp: 35, speed: 1.2, atk: 4 });
            } else {
                enemyMinions.push({ x: 520, y: 235, w: 16, h: 25, hp: 35, speed: -1.2, atk: 4 });
            }
        }

        function createEffect(x, y, radius, color) {
            effects.push({ x, y, radius, color, life: 12 });
        }

        function resetGame() {
            allyTower.hp = allyTower.maxHp;
            enemyTower.hp = enemyTower.maxHp;
            hero.hp = hero.maxHp;
            hero.x = 80;
            enemyHero.hp = enemyHero.maxHp;
            enemyHero.x = 480;
            enemyHero.isDead = false;
            friendlyMinions = [];
            enemyMinions = [];
            effects = [];
            frameCount = 0;
            isRunning = true;
            modal.style.display = 'none';
        }

        function endGame(win) {
            isRunning = false;
            modalTitle.innerText = win ? "বিজয় (VICTORY)!" : "পরাজয় (DEFEAT)!";
            modalDesc.innerText = win ? "আপনি শত্রুর মূল টাওয়ার ধ্বংস করেছেন!" : "আপনার মূল টাওয়ার ধ্বংস হয়ে গেছে!";
            startBtn.innerText = "আবার খেলুন";
            modal.style.display = 'flex';
        }

        function heroAttack() {
            if (!isRunning) return;
            createEffect(hero.x + hero.w + 10, hero.y + hero.h / 2, 14, '#ef4444');

            // শত্রু হিরো আক্রমণ
            if (!enemyHero.isDead && Math.abs((hero.x + hero.w) - enemyHero.x) < hero.atkRange) {
                enemyHero.hp -= hero.atkPower;
            }

            // শত্রু টাওয়ার আক্রমণ
            if (enemyTower.x - (hero.x + hero.w) < hero.atkRange) {
                enemyTower.hp -= hero.atkPower;
            }

            // মিনিয়ন আক্রমণ
            enemyMinions.forEach(m => {
                if (Math.abs((hero.x + hero.w) - m.x) < hero.atkRange) {
                    m.hp -= hero.atkPower;
                }
            });
        }

        function heroSkill() {
            if (!isRunning || hero.skillCooldown > 0) return;
            hero.skillCooldown = 150; // স্কিল কুলডাউন
            createEffect(hero.x + 60, hero.y + 20, 35, '#818cf8');

            // দূরপাল্লার শকওয়েভ
            if (!enemyHero.isDead && Math.abs(hero.x - enemyHero.x) < 140) {
                enemyHero.hp -= 35;
            }
            if (enemyTower.x - hero.x < 150) {
                enemyTower.hp -= 30;
            }
            enemyMinions.forEach(m => {
                if (Math.abs(hero.x - m.x) < 140) {
                    m.hp -= 35;
                }
            });
        }

        // ইনপুট হ্যান্ডলিং
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') hero.movingLeft = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') hero.movingRight = true;
            if (e.key.toLowerCase() === 'j') heroAttack();
            if (e.key.toLowerCase() === 'k') heroSkill();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') hero.movingLeft = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') hero.movingRight = false;
        });

        const bindTouch = (el, action) => {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); action(true); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); action(false); });
            el.addEventListener('mousedown', (e) => { action(true); });
            el.addEventListener('mouseup', (e) => { action(false); });
        };

        bindTouch(document.getElementById('btn-left'), (active) => hero.movingLeft = active);
        bindTouch(document.getElementById('btn-right'), (active) => hero.movingRight = active);
        document.getElementById('btn-atk').addEventListener('click', heroAttack);
        document.getElementById('btn-skill').addEventListener('click', heroSkill);
        startBtn.addEventListener('click', resetGame);

        function update() {
            if (!isRunning) return;
            frameCount++;

            // মিনিয়ন স্পন (প্রতি ৫ সেকেন্ডে)
            if (frameCount % 300 === 0) {
                spawnMinion('ally');
                spawnMinion('enemy');
            }

            // প্লেয়ার মুভমেন্ট ও রেঞ্জ লিমিট
            if (hero.movingLeft && hero.x > 60) hero.x -= hero.speed;
            if (hero.movingRight && hero.x < 515) hero.x += hero.speed;
            if (hero.skillCooldown > 0) hero.skillCooldown--;

            // শত্রু হিরো রেসপন ও AI মুভমেন্ট
            if (enemyHero.isDead) {
                enemyHero.respawnTimer--;
                if (enemyHero.respawnTimer <= 0) {
                    enemyHero.isDead = false;
                    enemyHero.hp = enemyHero.maxHp;
                    enemyHero.x = 480;
                }
            } else {
                const distToHero = enemyHero.x - (hero.x + hero.w);
                if (distToHero > enemyHero.atkRange) {
                    enemyHero.x -= enemyHero.speed;
                } else if (distToHero < 10) {
                    enemyHero.x += enemyHero.speed;
                } else {
                    // শত্রু আক্রমণ
                    if (enemyHero.atkCooldown <= 0) {
                        hero.hp -= enemyHero.atkPower;
                        createEffect(enemyHero.x - 10, enemyHero.y + 20, 10, '#f87171');
                        enemyHero.atkCooldown = 40;
                    }
                }
                if (enemyHero.atkCooldown > 0) enemyHero.atkCooldown--;

                if (enemyHero.hp <= 0) {
                    enemyHero.isDead = true;
                    enemyHero.respawnTimer = 250;
                }
            }

            // মিনিয়ন আপডেট ও মুখোমুখি লড়াই
            friendlyMinions.forEach(f => {
                let blocked = false;
                if (!enemyHero.isDead && (enemyHero.x - f.x < 20 && enemyHero.x > f.x)) {
                    blocked = true;
                    enemyHero.hp -= 0.1;
                }
                if (enemyTower.x - f.x < 25) {
                    blocked = true;
                    enemyTower.hp -= 0.15;
                }
                enemyMinions.forEach(e => {
                    if (Math.abs(f.x - e.x) < 18) {
                        blocked = true;
                        e.hp -= 0.2;
                        f.hp -= 0.2;
                    }
                });
                if (!blocked) f.x += f.speed;
            });

            enemyMinions.forEach(e => {
                let blocked = false;
                if (e.x - (hero.x + hero.w) < 15 && e.x > hero.x) {
                    blocked = true;
                    hero.hp -= 0.1;
                }
                if (e.x - allyTower.x < 35) {
                    blocked = true;
                    allyTower.hp -= 0.15;
                }
                if (!blocked) e.x += e.speed;
            });

            // মৃত মিনিয়ন ফিল্টার
            friendlyMinions = friendlyMinions.filter(m => m.hp > 0 && m.x < 540);
            enemyMinions = enemyMinions.filter(m => m.hp > 0 && m.x > 60);

            // ইফেক্ট লাইফটাইম
            effects.forEach(e => e.life--);
            effects = effects.filter(e => e.life > 0);

            // UI আপডেট
            playerHpText.innerText = `হিরো HP: ${Math.max(0, Math.floor(hero.hp))}`;
            enemyTowerHpText.innerText = `শত্রুর টাওয়ার: ${Math.max(0, Math.floor(enemyTower.hp))}`;

            // ফলাফল চেক
            if (hero.hp <= 0 || allyTower.hp <= 0) endGame(false);
            if (enemyTower.hp <= 0) endGame(true);
        }

        function drawHealthBar(x, y, w, current, max, color) {
            ctx.fillStyle = '#334155';
            ctx.fillRect(x, y, w, 5);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, Math.max(0, (current / max) * w), 5);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // গ্রাউন্ড ও লেন
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, 260);
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 260, canvas.width, 60);

            // টাওয়ার আঁকা (নীল টাওয়ার - ফ্রেন্ডলি, লাল টাওয়ার - শত্রু)
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(allyTower.x, allyTower.y, allyTower.w, allyTower.h);
            drawHealthBar(allyTower.x - 5, allyTower.y - 12, allyTower.w + 10, allyTower.hp, allyTower.maxHp, '#3b82f6');

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(enemyTower.x, enemyTower.y, enemyTower.w, enemyTower.h);
            drawHealthBar(enemyTower.x - 5, enemyTower.y - 12, enemyTower.w + 10, enemyTower.hp, enemyTower.maxHp, '#ef4444');

            // ফ্রেন্ডলি মিনিয়ন
            ctx.fillStyle = '#60a5fa';
            friendlyMinions.forEach(m => {
                ctx.fillRect(m.x, m.y, m.w, m.h);
                drawHealthBar(m.x, m.y - 6, m.w, m.hp, 35, '#60a5fa');
            });

            // শত্রু মিনিয়ন
            ctx.fillStyle = '#f87171';
            enemyMinions.forEach(m => {
                ctx.fillRect(m.x, m.y, m.w, m.h);
                drawHealthBar(m.x, m.y - 6, m.w, m.hp, 35, '#f87171');
            });

            // শত্রু হিরো
            if (!enemyHero.isDead) {
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(enemyHero.x, enemyHero.y, enemyHero.w, enemyHero.h);
                drawHealthBar(enemyHero.x - 6, enemyHero.y - 10, enemyHero.w + 12, enemyHero.hp, enemyHero.maxHp, '#ef4444');
            }

            // প্লেয়ার হিরো (গোল্ডেন আর্মর)
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
            drawHealthBar(hero.x - 6, hero.y - 10, hero.w + 12, hero.hp, hero.maxHp, '#22c55e');

            // ইফেক্টস
            effects.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
