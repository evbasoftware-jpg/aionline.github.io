<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report - Census 2027</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            border-top: 6px solid #1a73e8;
        }
        .badge {
            display: inline-block;
            background-color: #e8f0fe;
            color: #1a73e8;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 { font-size: 20px; color: #202124; margin-bottom: 10px; }
        p.description { font-size: 14px; color: #5f6368; margin-bottom: 24px; }
        .date-box {
            background-color: #f8f9fa;
            border: 1px dashed #dadce0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 15px;
            color: #3c4043;
        }
        .date-box span { font-weight: bold; color: #1a73e8; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.3);
        }
        .btn:hover { background-color: #1557b0; }
        .footer-text { font-size: 12px; color: #9aa0a6; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">CENSUS 2027</span>
        <h1>DAILY REPORT ON SELF ENUMERATION</h1>
        <p class="description">আজকের রিপোর্ট জমা দিতে নিচের বাটনে ক্লিক করুন।</p>
        
        <div class="date-box">
            আজকের তারিখ: <span id="displayDate">লোড হচ্ছে...</span>
        </div>

        <a id="censusFormLink" href="#" target="_blank" class="btn">
            আজকের ফর্ম খুলুন ➔
        </a>

        <p class="footer-text">Google Forms-এ সঠিক তারিখ সহ রিপোর্ট জমা হবে</p>
    </div>

    <script>
        function setTodayDate() {
            // ইউজারের ডিভাইসের লোকাল ডেট পাওয়ার সঠিক পদ্ধতি
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            // ফর্মের জন্য YYYY-MM-DD
            const formattedDate = year + '-' + month + '-' + day;
            
            // স্ক্রিনে দেখানোর জন্য DD/MM/YYYY
            const displayFormattedDate = day + '/' + month + '/' + year;

            // তারিখ বসানো
            document.getElementById("displayDate").innerText = displayFormattedDate;

            // ফর্মের লিঙ্ক তৈরি করা
            const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSe3i_K5UG0CioY-kXhEU2VTzgqg_fmp6ahMN75xEvvaSo8U_w/viewform?usp=pp_url&entry.1843187265=";
            document.getElementById("censusFormLink").href = baseUrl + formattedDate;
        }

        // পেজ লোড হলেই ফাংশনটি রান করবে
        window.onload = setTodayDate;
    </script>

</body>
</html>
