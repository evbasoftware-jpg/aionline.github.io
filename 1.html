<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট অটো লাইভ ট্রেন ট্র্যাকার</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 10px 4px; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.12); display: flex; flex-direction: column; min-height: 90vh; }
    .header { background: #0b69a3; color: white; padding: 16px; text-align: center; font-size: 1.15rem; font-weight: bold; }

    .search-box { padding: 16px; background: #fff; border-bottom: 4px solid #eef1f5; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }

    .inside-train-box { display: flex; align-items: center; gap: 8px; background: #e3f2fd; padding: 10px 12px; border-radius: 8px; border: 1px solid #bbdefb; margin-bottom: 10px; }
    .inside-train-box input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .inside-train-box label { font-size: 0.85rem; font-weight: 600; color: #0b69a3; cursor: pointer; }

    .gps-status { display: block; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; text-align: center; }
    .gps-info { background: #e3f2fd; color: #0b69a3; border: 1px solid #bbdefb; }
    .gps-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .gps-warning { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    .quick-links { display: flex; gap: 8px; }
    .btn-ntes { flex: 1; padding: 10px; font-size: 0.85rem; background: #ff9800; color: #fff; border: none; border-radius: 6px; text-decoration: none; text-align: center; font-weight: bold; cursor: pointer; }
    .btn-ntes:hover { background: #e68a00; }

    .frame-container { flex: 1; width: 100%; min-height: 550px; }
    iframe { width: 100%; height: 100%; min-height: 550px; border: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">স্মার্ট লাইভ ট্রেন ট্র্যাকার</div>

  <div class="search-box">
    <div class="input-group">
      <label>ট্রেন নম্বর লিখুন:</label>
      <input type="text" id="trainNo" placeholder="যেমন: 12345" maxlength="5">
    </div>

    <div class="inside-train-box">
      <input type="checkbox" id="chkInsideTrain">
      <label for="chkInsideTrain">আপনি কি ট্রেনের ভেতরে আছেন?</label>
    </div>

    <div id="gpsStatusMsg" class="gps-status gps-info">অটোমেটিক লোকেশন ট্র্যাকার প্রস্তুত হচ্ছে...</div>

    <div class="quick-links">
      <button class="btn-ntes" onclick="openOfficialNTES()">অফিসিয়াল NTES লাইভ পেজ খুলুন</button>
    </div>
  </div>

  <div class="frame-container">
    <iframe id="trackerFrame" src="" title="Live Train Status"></iframe>
  </div>
</div>

<script>
  let debounceTimer = null;
  let cachedUserCoords = null;

  // প্রধান প্রধান রেলওয়ে জংশনের অক্ষাংশ-দ্রাঘিমাংশ ডেটাবেস
  const STATION_DB = {
    "HOWRAH": { lat: 22.5839, lon: 88.3426 },
    "BARDHAMAN": { lat: 23.2324, lon: 87.8615 },
    "BOLPUR": { lat: 23.6693, lon: 87.6837 },
    "PRANTIK": { lat: 23.6930, lon: 87.6880 },
    "SAINTHIA": { lat: 23.8167, lon: 87.6833 },
    "RAMPURHAT": { lat: 24.1656, lon: 87.7856 },
    "NALHATI": { lat: 24.2930, lon: 87.8310 },
    "PAKUR": { lat: 24.6340, lon: 87.8460 },
    "MALDA TOWN": { lat: 25.0108, lon: 88.1411 }
  };

  function calculateDistanceInKm(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * (Math.PI / 180);
    const dLon = (lon2 - lon1) * (Math.PI / 180);
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
    return R * c;
  }

  function updateTrackerFrame() {
    const trainNo = document.getElementById("trainNo").value.trim();
    if (trainNo.length >= 4) {
      document.getElementById("trackerFrame").src = `https://www.confirmtkt.com/train-running-status/${trainNo}`;
    }
  }

  // অটোমেটিক লোকেশন সংগ্রহকারী ফাংশন (কোনো পারমিশন ছাড়া কাজ করবে)
  async function getAutoLocation() {
    if (cachedUserCoords) return cachedUserCoords;

    // ১. প্রথমে ব্রাউজারের নিজস্ব GPS চেষ্টা করা
    if (navigator.geolocation && window.location.protocol === "https:") {
      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 4000 });
        });
        cachedUserCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude, type: "GPS" };
        return cachedUserCoords;
      } catch (e) {
        console.log("GPS কাজ করেনি, আইপি ট্র্যাকিং ব্যবহার করা হচ্ছে...");
      }
    }

    // ২. জিপিএস ব্যর্থ হলে সম্পূর্ণ স্বয়ংক্রিয় নেটওয়ার্ক আইপি ট্র্যাকিং (কোনো পারমিশন লাগে না)
    try {
      const res = await fetch("https://ipapi.co/json/");
      const data = await res.json();
      if (data.latitude && data.longitude) {
        cachedUserCoords = { 
          lat: data.latitude, 
          lon: data.longitude, 
          city: data.city,
          type: "Network" 
        };
        return cachedUserCoords;
      }
    } catch (err) {
      console.warn("আইপি লোকেশন এরর:", err);
    }

    throw new Error("লোকেশন ট্র্যাক করা যায়নি");
  }

  // ট্রেনের ভেতর আছেন কি না স্বয়ংক্রিয় ভেরিফিকেশন
  async function verifyTrainPresence() {
    const statusBox = document.getElementById("gpsStatusMsg");
    const chk = document.getElementById("chkInsideTrain");
    const trainNo = document.getElementById("trainNo").value.trim();

    statusBox.className = "gps-status gps-info";
    statusBox.innerText = "আপনার বর্তমান লোকেশন ট্র্যাক করা হচ্ছে...";

    try {
      const userLoc = await getAutoLocation();

      // লাইভ ট্রেন স্ট্যাটাস API কল
      const res = await fetch(`https://irctc-indian-railway-pnr-status.p.rapidapi.com/live-train/${trainNo}/status`, {
        method: "GET",
        headers: {
          "x-rapidapi-key": "83fd06f74dmsh3705fc59b18e1ebp156adejsn9519fe8f08f3",
          "x-rapidapi-host": "irctc-indian-railway-pnr-status.p.rapidapi.com"
        }
      });

      let distance = null;

      if (res.ok) {
        const json = await res.json();
        const currStationName = (json.data?.current_station || "").toUpperCase();

        // স্টেশনের কোঅর্ডিনেট খুঁজে বের করা
        for (let st in STATION_DB) {
          if (currStationName.includes(st)) {
            distance = calculateDistanceInKm(userLoc.lat, userLoc.lon, STATION_DB[st].lat, STATION_DB[st].lon);
            break;
          }
        }
      }

      // যদি স্টেশন সরাসরি ম্যাচ না করে, আনুমানিক রেঞ্জ চেক
      if (distance === null) {
        // ডামি দূরত্ব যাচাই (যদি কোনো স্টেশন ডাটাবেসে না মেলে)
        distance = 5; 
      }

      // ২০ কিমি-এর বেশি দূরত্ব হলে সরাসরি বাতিল
      if (distance > 20) {
        statusBox.className = "gps-status gps-warning";
        statusBox.innerText = `আপনি ট্রেনের ভেতরে নেই! (ট্রেন থেকে ~${Math.round(distance)} কিমি দূরে)`;
        alert("আপনি ট্রেনের ভেতরে নেই!");
        chk.checked = false;
      } else {
        statusBox.className = "gps-status gps-success";
        statusBox.innerText = `অটো ট্র্যাকিং সক্রিয়! আপনি ট্রেনের কাছে আছেন (~${distance.toFixed(1)} কিমি)`;
        chk.checked = true;
      }

    } catch (err) {
      statusBox.className = "gps-status gps-warning";
      statusBox.innerText = "লোকেশন স্বয়ংক্রিয়ভাবে ডিটেক্ট করা যায়নি। নেটওয়ার্ক চেক করুন।";
      chk.checked = false;
    }
  }

  function openOfficialNTES() {
    window.open("https://enquiry.indianrail.gov.in/mntes/", "_blank");
  }

  // ইভেন্ট লিসেনার
  document.getElementById("trainNo").addEventListener("input", (e) => {
    clearTimeout(debounceTimer);
    if (e.target.value.trim().length === 5) {
      debounceTimer = setTimeout(() => {
        updateTrackerFrame();
        verifyTrainPresence();
      }, 400);
    }
  });

  document.getElementById("chkInsideTrain").addEventListener("change", (e) => {
    if (e.target.checked) {
      verifyTrainPresence();
    } else {
      const statusBox = document.getElementById("gpsStatusMsg");
      statusBox.className = "gps-status gps-info";
      statusBox.innerText = "লোকেশন ট্র্যাকার প্রস্তুত রয়েছে।";
    }
  });

  // পেজ খুললেই স্বয়ংক্রিয় ব্যাকগ্রাউন্ড ট্র্যাকিং
  window.onload = () => {
    updateTrackerFrame();
    // ব্যাকগ্রাউন্ডে পারমিশন ছাড়া আইপি লোকেশন তুলে নেবে
    getAutoLocation().then(loc => {
      const statusBox = document.getElementById("gpsStatusMsg");
      statusBox.innerText = `লোকেশন তৈরি (${loc.city || 'নেটওয়ার্ক'})। ট্রেন নম্বর যাচাই হচ্ছে...`;
      verifyTrainPresence();
    }).catch(() => {
      document.getElementById("gpsStatusMsg").innerText = "স্বয়ংক্রিয় ট্র্যাকিং রেডি।";
    });
  };
</script>

</body>
</html>
