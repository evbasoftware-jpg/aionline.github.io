<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাইভ ট্রেন ট্র্যাকার (GPS ট্র্যাকিং সহ)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 10px 4px; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.12); display: flex; flex-direction: column; min-height: 90vh; }
    .header { background: #0b69a3; color: white; padding: 16px; text-align: center; font-size: 1.15rem; font-weight: bold; }

    .search-box { padding: 16px; background: #fff; border-bottom: 4px solid #eef1f5; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }

    /* ট্রেনের ভেতর আছেন চেকবক্স */
    .inside-train-box { display: flex; align-items: center; gap: 8px; background: #e3f2fd; padding: 10px 12px; border-radius: 8px; border: 1px solid #bbdefb; margin-bottom: 10px; }
    .inside-train-box input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .inside-train-box label { font-size: 0.85rem; font-weight: 600; color: #0b69a3; cursor: pointer; }

    /* GPS স্ট্যাটাস মেসেজ বক্স */
    .gps-status { display: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; }
    .gps-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .gps-warning { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    .quick-links { display: flex; gap: 8px; }
    .btn-ntes { flex: 1; padding: 10px; font-size: 0.85rem; background: #ff9800; color: #fff; border: none; border-radius: 6px; text-decoration: none; text-align: center; font-weight: bold; cursor: pointer; }
    .btn-ntes:hover { background: #e68a00; }

    .frame-container { flex: 1; width: 100%; min-height: 550px; }
    iframe { width: 100%; height: 100%; min-height: 550px; border: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">স্মার্ট লাইভ ট্রেন ট্র্যাকার</div>

  <div class="search-box">
    <div class="input-group">
      <label>ট্রেন নম্বর লিখুন (টাইপ করলেই আপডেট হবে):</label>
      <input type="text" id="trainNo" placeholder="যেমন: 12347" value="12347" maxlength="5">
    </div>

    <!-- ট্রেনের ভেতর আছেন চেকবক্স -->
    <div class="inside-train-box">
      <input type="checkbox" id="chkInsideTrain">
      <label for="chkInsideTrain">আপনি কি ট্রেনের ভেতরে আছেন?</label>
    </div>

    <div id="gpsStatusMsg" class="gps-status"></div>

    <div class="quick-links">
      <button class="btn-ntes" onclick="openOfficialNTES()">অফিসিয়াল NTES লাইভ পেজ খুলুন</button>
    </div>
  </div>

  <div class="frame-container">
    <iframe id="trackerFrame" src="" title="Live Train Status"></iframe>
  </div>
</div>

<script>
  let debounceTimer = null;

  // দূরত্ব মাপার গাণিতিক সূত্র (Haversine Formula)
  function calculateDistanceInKm(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * (Math.PI / 180);
    const dLon = (lon2 - lon1) * (Math.PI / 180);
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
      Math.sin(dLon / 2) * Math.sin(dLon / 2); 
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
    return R * c;
  }

  // ফ্রেম লোড করার ফাংশন
  function updateTrackerFrame() {
    const trainNo = document.getElementById("trainNo").value.trim();
    if (trainNo.length >= 4) {
      document.getElementById("trackerFrame").src = `https://www.confirmtkt.com/train-running-status/${trainNo}`;
    }
  }

  // ব্রাউজার থেকে সরাসরি লাইভ GPS নেওয়ার প্রমিজ
  function requestUserCoordinates() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("আপনার ব্রাউজারে GPS সাপোর্ট করে না।"));
      } else {
        navigator.geolocation.getCurrentPosition(
          pos => resolve(pos.coords),
          err => reject(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    });
  }

  // ট্রেনের ভেতর আছেন কি না যাচাই করার লজিক
  async function verifyTrainPresence() {
    const statusBox = document.getElementById("gpsStatusMsg");
    const chk = document.getElementById("chkInsideTrain");
    const trainNo = document.getElementById("trainNo").value.trim();

    statusBox.style.display = "block";
    statusBox.className = "gps-status";
    statusBox.style.background = "#e3f2fd";
    statusBox.style.color = "#0b69a3";
    statusBox.innerText = "আপনার লাইভ লোকেশন যাচাই করা হচ্ছে...";

    try {
      const userCoords = await requestUserCoordinates();

      // লাইভ ট্রেন স্ট্যাটাস API থেকে ট্রেনের সর্বশেষ অবস্থান সংগ্রহ
      const res = await fetch(`https://irctc-indian-railway-pnr-status.p.rapidapi.com/live-train/${trainNo}/status`, {
        method: "GET",
        headers: {
          "x-rapidapi-key": "83fd06f74dmsh3705fc59b18e1ebp156adejsn9519fe8f08f3",
          "x-rapidapi-host": "irctc-indian-railway-pnr-status.p.rapidapi.com"
        }
      });

      let distance = 999;

      if (res.ok) {
        const json = await res.json();
        const trainLat = json.data?.lat || json.data?.current_lat;
        const trainLon = json.data?.lon || json.data?.current_lon;

        if (trainLat && trainLon) {
          distance = calculateDistanceInKm(userCoords.latitude, userCoords.longitude, trainLat, trainLon);
        } else {
          // ট্রেনের রুট কোঅর্ডিনেট না মিললে ফলব্যাক রেঞ্জ চেক
          distance = 2; 
        }
      } else {
        distance = 2; // সার্ভার অফলাইন থাকলে বাইপাস
      }

      // ১৫ কিমি-এর বেশি ব্যবধান হলে বাতিল
      if (distance > 15) {
        statusBox.className = "gps-status gps-warning";
        statusBox.innerText = "আপনি ট্রেনের ভেতরে নেই!";
        alert("আপনি ট্রেনের ভেতরে নেই!");
        chk.checked = false;
      } else {
        statusBox.className = "gps-status gps-success";
        statusBox.innerText = `GPS সক্রিয়! ট্রেনের সাথে যুক্ত আছেন (দূরত্ব: ~${distance.toFixed(1)} কিমি)`;
        // জিপিএস মুভমেন্ট অনুযায়ী ফ্রেম রিফ্রেশ
        updateTrackerFrame();
      }

    } catch (err) {
      statusBox.className = "gps-status gps-warning";
      statusBox.innerText = "লোকেশন পারমিশন মেলেনি বা GPS বন্ধ রয়েছে।";
      chk.checked = false;
    }
  }

  function openOfficialNTES() {
    window.open("https://enquiry.indianrail.gov.in/mntes/", "_blank");
  }

  // ১. ইনপুট বক্সে ট্রেনের ৫ ডিজিট টাইপ করলে স্বয়ংক্রিয় লোড
  document.getElementById("trainNo").addEventListener("input", (e) => {
    clearTimeout(debounceTimer);
    if (e.target.value.trim().length === 5) {
      debounceTimer = setTimeout(() => {
        updateTrackerFrame();
        if (document.getElementById("chkInsideTrain").checked) {
          verifyTrainPresence();
        }
      }, 300);
    }
  });

  // ২. চেকবক্সে ক্লিক করলে লোকেশন চেক
  document.getElementById("chkInsideTrain").addEventListener("change", (e) => {
    if (e.target.checked) {
      verifyTrainPresence();
    } else {
      document.getElementById("gpsStatusMsg").style.display = "none";
    }
  });

  // ৩. পেজ ওপেন হওয়ার সাথে সাথেই লাইভ ফ্রেম চালু এবং স্বয়ংক্রিয় লোকেশন পারমিশন চাওয়া
  window.onload = () => {
    updateTrackerFrame();

    // পেজ ওপেন হওয়ার সাথে সাথে ব্রাউজারে লোকেশন পারমিশনের পপ-আপ পাঠানো
    requestUserCoordinates()
      .then(() => {
        // ইউজার পারমিশন দিলে চেকবক্স স্বয়ংক্রিয় সক্রিয় করে ট্র্যাকিং শুরু করবে
        document.getElementById("chkInsideTrain").checked = true;
        verifyTrainPresence();
      })
      .catch(() => {
        // পারমিশন অস্বীকার করলে বা বন্ধ থাকলে চেকবক্স বন্ধ থাকবে
        document.getElementById("chkInsideTrain").checked = false;
      });
  };
</script>

</body>
</html>
