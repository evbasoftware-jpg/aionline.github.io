<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Data Entry Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
    }
    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      text-transform: uppercase;
    }
    input[type="email"] {
      text-transform: none;
    }
    input:focus, select:focus {
      border-color: #007bff;
      outline: none;
    }
    .btn-submit {
      margin-top: 20px;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .response-message {
      text-align: center;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
    }
    .success-msg {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error-msg {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>CANDIDATE DATA ENTRY FORM</h2>
  
  <div id="statusMessage" class="response-message"></div>

  <form id="candidateForm">
    <div class="grid-container">
      
      <div class="form-group">
        <label>YEAR</label>
        <input type="number" name="year" value="2026" required>
      </div>

      <div class="form-group">
        <label>DISTRICT NAME</label>
        <select name="districtName" required>
          <option value="">SELECT DISTRICT</option>
          <option value="ALIPURDUAR">ALIPURDUAR</option>
          <option value="BANKURA">BANKURA</option>
          <option value="PASCHIM BARDHAMAN">PASCHIM BARDHAMAN</option>
          <option value="PURBA BARDHAMAN">PURBA BARDHAMAN</option>
          <option value="BIRBHUM">BIRBHUM</option>
          <option value="COOCH BEHAR">COOCH BEHAR</option>
          <option value="DAKSHIN DINAJPUR">DAKSHIN DINAJPUR</option>
          <option value="DARJEELING">DARJEELING</option>
          <option value="HOOGHLY">HOOGHLY</option>
          <option value="HOWRAH">HOWRAH</option>
          <option value="JALPAIGURI">JALPAIGURI</option>
          <option value="JHARGRAM">JHARGRAM</option>
          <option value="KALIMPONG">KALIMPONG</option>
          <option value="KOLKATA">KOLKATA</option>
          <option value="MALDA">MALDA</option>
          <option value="MURSHIDABAD">MURSHIDABAD</option>
          <option value="NADIA">NADIA</option>
          <option value="NORTH 24 PARGANAS">NORTH 24 PARGANAS</option>
          <option value="PASCHIM MEDINIPUR">PASCHIM MEDINIPUR</option>
          <option value="PURBA MEDINIPUR">PURBA MEDINIPUR</option>
          <option value="PURULIA">PURULIA</option>
          <option value="SOUTH 24 PARGANAS">SOUTH 24 PARGANAS</option>
          <option value="UTTAR DINAJPUR">UTTAR DINAJPUR</option>
        </select>
      </div>

      <div class="form-group">
        <label>DISTRICT CODE</label>
        <input type="text" name="districtCode">
      </div>

      <div class="form-group">
        <label>FILE</label>
        <input type="text" name="file">
      </div>

      <div class="form-group">
        <label>CENTRE CODE</label>
        <input type="text" name="centreCode">
      </div>

      <div class="form-group">
        <label>CENTRE NAME</label>
        <input type="text" name="centreName">
      </div>

      <div class="form-group">
        <label>SCHOOL CODE</label>
        <input type="text" name="schoolCode">
      </div>

      <div class="form-group">
        <label>SCHOOL NAME</label>
        <input type="text" name="schoolName" required>
      </div>

      <div class="form-group">
        <label>SCHOOL CIRCLE</label>
        <input type="text" name="schoolCircle">
      </div>

      <div class="form-group">
        <label>SCHOOL CATEGORY</label>
        <select name="schoolCategory" required>
          <option value="">SELECT CATEGORY</option>
          <option value="GOVT SCHOOL">GOVT SCHOOL</option>
          <option value="PRIVATE SCHOOL">PRIVATE SCHOOL</option>
        </select>
      </div>

      <div class="form-group">
        <label>SCHOOL MEDIUM</label>
        <select name="schoolMedium" required>
          <option value="">SELECT MEDIUM</option>
          <option value="BENGALI">BENGALI</option>
          <option value="ENGLISH">ENGLISH</option>
          <option value="HINDI">HINDI</option>
          <option value="URDU">URDU</option>
          <option value="NEPALI">NEPALI</option>
          <option value="SANTHALI">SANTHALI</option>
          <option value="OTHER">OTHER</option>
        </select>
      </div>

      <div class="form-group">
        <label>CANDIDATE GENDER</label>
        <select name="candidateGender" required>
          <option value="">SELECT GENDER</option>
          <option value="MALE">MALE</option>
          <option value="FEMALE">FEMALE</option>
          <option value="OTHER">OTHER</option>
        </select>
      </div>

      <div class="form-group">
        <label>CANDIDATE NAME</label>
        <input type="text" name="candidateName" required>
      </div>

      <div class="form-group">
        <label>DATE OF BIRTH</label>
        <input type="date" name="dob" required>
      </div>

      <div class="form-group">
        <label>GUARDIAN NAME</label>
        <input type="text" name="guardianName" required>
      </div>

      <div class="form-group">
        <label>CONTACT NO</label>
        <input type="tel" name="contactNo" required>
      </div>

      <div class="form-group">
        <label>E-MAIL ADDRESS</label>
        <input type="email" name="email" required>
      </div>

    </div>

    <button type="submit" id="submitBtn" class="btn-submit">SUBMIT DATA</button>
  </form>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbw8va39dRDZR1Th5X3guDMhgHcuUlDd9qGQPtt1By_8xyNTZJYbebnkrUByytaVAepkYg/exec';
  const form = document.getElementById('candidateForm');
  const statusMsg = document.getElementById('statusMessage');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'SUBMITTING...';
    statusMsg.style.display = 'none';

    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => response.json()) // response.text() এর বদলে JSON পার্স করা হচ্ছে
      .then(result => {
        // status যদি duplicate হয় বা মেসেজে "not allowed" থাকে
        if (result.status === "duplicate" || (result.message && result.message.includes("not allowed"))) {
          statusMsg.className = 'response-message error-msg';
          statusMsg.innerText = '❌ THIS CANDIDATE HAS ALREADY BEEN SUBMITTED (NAME, DOB & CONTACT MATCHED)!';
        } else if (result.status === "success") {
          statusMsg.className = 'response-message success-msg';
          statusMsg.innerText = '✅ DATA SUBMITTED SUCCESSFULLY!';
          form.reset();
        }
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'SUBMIT DATA';
      })
      .catch(error => {
        statusMsg.className = 'response-message error-msg';
        statusMsg.innerText = '❌ SOMETHING WENT WRONG. PLEASE TRY AGAIN!';
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'SUBMIT DATA';
      });
  });
</script>

</body>
</html>
